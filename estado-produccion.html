<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervecería Tierra Grande — Estado de producción</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root{
  --bg1:#1a1a1a;
  --bg2:#0e0e0e;
  --card:#252525;
  --copper:#FF6200;
  --copper-light:#FF8533;
  --ink:#E8E8E8;
  --muted:#8a8a8a;
  --green:#3ecf4a;
  --green-dark:#2a9e36;
  --line:#404040;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:'Rajdhani',sans-serif;
  color:var(--ink);
  padding:24px 16px 60px;
}
.wrap{max-width:640px;margin:0 auto;}
header{text-align:center;margin-bottom:28px;}
header h1{
  font-family:'Chakra Petch',sans-serif;
  font-weight:700;
  font-size:1.7em;
  color:var(--copper);
  letter-spacing:1px;
  margin:0 0 4px;
  text-transform:uppercase;
}
header .sub{
  font-family:'Share Tech Mono',monospace;
  color:#b0b0b0;
  font-size:0.9em;
  letter-spacing:1px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 22px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
}
.card .receta{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  font-size:1.25em;
  margin-bottom:10px;
}
.badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:0.82em;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:5px 12px;
  border-radius:20px;
  margin-bottom:14px;
}
.badge.fermentando{background:rgba(255,98,0,0.18);color:var(--copper-light);border:1px solid var(--copper);}
.badge.reposo{background:rgba(62,207,74,0.15);color:var(--green);border:1px solid var(--green-dark);}
.badge.listo{background:rgba(62,207,74,0.28);color:#eafff0;border:1px solid var(--green);}
.detail-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:0.95em;
  gap:12px;
}
.detail-row .lbl{color:var(--muted);}
.detail-row .val{font-family:'Share Tech Mono',monospace;color:var(--ink);text-align:right;}
.empty{
  text-align:center;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  padding:60px 20px;
  font-size:0.95em;
  line-height:1.5;
}
.updated{
  text-align:center;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  font-size:0.78em;
  margin-top:24px;
  letter-spacing:0.5px;
}
.loading{text-align:center;color:var(--muted);padding:60px 20px;font-family:'Share Tech Mono',monospace;}
.error-box{
  background:#2a1515;
  border:1px solid #5a2a2a;
  border-radius:8px;
  padding:16px;
  margin-top:16px;
  font-size:0.85em;
  color:#ffb4b4;
  font-family:'Share Tech Mono',monospace;
  word-break:break-word;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍺 Cervecería Tierra Grande</h1>
    <div class="sub">ESTADO DE PRODUCCIÓN</div>
  </header>
  <div id="content"><div class="loading">Cargando…</div></div>
  <div class="updated" id="updated"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA949Wrf0ErPiWYhGUx5Pk25M21dQZ7Dgs",
  authDomain: "cervecera-tierra-grande.firebaseapp.com",
  databaseURL: "https://cervecera-tierra-grande-default-rtdb.firebaseio.com",
  projectId: "cervecera-tierra-grande",
  storageBucket: "cervecera-tierra-grande.firebasestorage.app",
  messagingSenderId: "243316014670",
  appId: "1:243316014670:web:0545ce0b0cb81f7af54d1f",
  measurementId: "G-8NDCKNGPB0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Solo datos necesarios para esta vista (sin costos ni inventario)
const RECETAS = {
  'r-stout':        { nombre:'Coffee Stout',                    fermentandoDays:8, fermenterDays:12, tiempoTotalDias:32 },
  'r-belgian':      { nombre:'Belgian Blonde Albahaca-Romero',  fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24 },
  'r-honey-wheat':  { nombre:'Honey Wheat',                    fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24 },
  'r-dry-stout':    { nombre:'Dry Stout',                      fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24 },
};

function daysBetween(iso){
  if(!iso) return 0;
  const start = new Date(iso + 'T00:00:00');
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMid - start) / 86400000);
}
function addDaysISO(iso, days){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmtDate(d){
  if(!d) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'long', year:'numeric'});
}

function render(fermentadores){
  const content = document.getElementById('content');
  const lista = Array.isArray(fermentadores)
    ? fermentadores
    : (fermentadores ? Object.values(fermentadores) : []);

  const ocupados = lista.filter(f => f && f.estado === 'ocupado' && f.recetaId);

  if(ocupados.length === 0){
    content.innerHTML = '<div class="empty">No hay lotes en producción en este momento.<br>El siguiente lote se anunciará aquí en cuanto arranque.</div>';
    return;
  }

  content.innerHTML = ocupados.map(f => {
    const receta = RECETAS[f.recetaId];
    if(!receta) return '';
    const dias = daysBetween(f.fechaInicio);

    let etapa, claseEtapa;
    if(dias < receta.fermentandoDays){
      etapa = 'Fermentando';
      claseEtapa = 'fermentando';
    } else if(dias < receta.fermenterDays){
      etapa = 'En reposo';
      claseEtapa = 'reposo';
    } else {
      etapa = 'Listo para embotellar';
      claseEtapa = 'listo';
    }

    const fechaEntrega = addDaysISO(f.fechaInicio, receta.tiempoTotalDias);

    return `
      <div class="card">
        <div class="receta">${receta.nombre}</div>
        <span class="badge ${claseEtapa}">${etapa}</span>
        <div class="detail-row">
          <span class="lbl">Elaboración iniciada</span>
          <span class="val">${fmtDate(new Date(f.fechaInicio + 'T00:00:00'))}</span>
        </div>
        <div class="detail-row">
          <span class="lbl">Días de proceso</span>
          <span class="val">${dias} día${dias === 1 ? '' : 's'}</span>
        </div>
        <div class="detail-row">
          <span class="lbl">Fecha estimada de entrega</span>
          <span class="val">${fmtDate(fechaEntrega)}</span>
        </div>
      </div>
    `;
  }).join('');
}

function showError(msg, detail){
  document.getElementById('content').innerHTML = `
    <div class="empty">
      No se pudo cargar la información en este momento.
      <div class="error-box">${msg}${detail ? '<br><br>' + detail : ''}</div>
    </div>`;
}

// Lectura directa (sin autenticación anónima)
db.ref('bitacora/fermentadores').on('value', snap => {
  try {
    render(snap.val());
    document.getElementById('updated').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-MX');
  } catch (e) {
    console.error(e);
    showError('Error al procesar los datos.', e.message);
  }
}, err => {
  console.error(err);
  showError(
    'Error de permisos o de conexión.',
    (err && err.message) ? err.message : 'Revisa las reglas de Firebase Realtime Database.'
  );
});
</script>
</body>
</html>
