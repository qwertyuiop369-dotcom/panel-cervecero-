<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerveza Locundus — Estado de producción</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root{
  --bg1:#1a1a1a;
  --bg2:#0e0e0e;
  --card:#252525;
  --copper:#FF6200;
  --copper-light:#FF8533;
  --ink:#E8E8E8;
  --muted:#8a8a8a;
  --green:#3ecf4a;
  --green-dark:#2a9e36;
  --line:#404040;
  --blue:#4aa3ff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:'Rajdhani',sans-serif;
  color:var(--ink);
  padding:24px 16px 60px;
}
.wrap{max-width:640px;margin:0 auto;}
header{text-align:center;margin-bottom:28px;}
header h1{
  font-family:'Chakra Petch',sans-serif;
  font-weight:700;
  font-size:1.7em;
  color:var(--copper);
  letter-spacing:1px;
  margin:0 0 4px;
  text-transform:uppercase;
}
header .sub{
  font-family:'Share Tech Mono',monospace;
  color:#b0b0b0;
  font-size:0.9em;
  letter-spacing:1px;
}
.section-title{
  font-family:'Chakra Petch',sans-serif;
  font-size:0.85em;
  color:var(--muted);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:8px 0 12px;
  padding-left:2px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.35);
}
.card .receta{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  font-size:1.25em;
  margin-bottom:8px;
}
.card .lote-id{
  font-family:'Share Tech Mono',monospace;
  font-size:0.82em;
  color:var(--muted);
  margin-bottom:10px;
}
.badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:0.82em;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:5px 12px;
  border-radius:20px;
  margin-bottom:12px;
}
.badge.fermentando{background:rgba(255,98,0,0.18);color:var(--copper-light);border:1px solid var(--copper);}
.badge.reposo{background:rgba(62,207,74,0.15);color:var(--green);border:1px solid var(--green-dark);}
.badge.listo{background:rgba(62,207,74,0.28);color:#eafff0;border:1px solid var(--green);}
.badge.carbonatando{background:rgba(74,163,255,0.18);color:var(--blue);border:1px solid #2a6ab8;}
.detail-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:0.95em;
  gap:12px;
}
.detail-row .lbl{color:var(--muted);}
.detail-row .val{font-family:'Share Tech Mono',monospace;color:var(--ink);text-align:right;}
.empty{
  text-align:center;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  padding:60px 20px;
  font-size:0.95em;
  line-height:1.5;
}
.updated{
  text-align:center;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  font-size:0.78em;
  margin-top:24px;
  letter-spacing:0.5px;
}
.loading{text-align:center;color:var(--muted);padding:60px 20px;font-family:'Share Tech Mono',monospace;}
.error-box{
  background:#2a1515;
  border:1px solid #5a2a2a;
  border-radius:8px;
  padding:16px;
  margin-top:16px;
  font-size:0.85em;
  color:#ffb4b4;
  font-family:'Share Tech Mono',monospace;
  word-break:break-word;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍺 Cerveza Locundus</h1>
    <div class="sub">ESTADO DE PRODUCCIÓN · PARA PIZZERÍA LOCUNDUS</div>
  </header>
  <div id="content"><div class="loading">Cargando…</div></div>
  <div class="updated" id="updated"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA949Wrf0ErPiWYhGUx5Pk25M21dQZ7Dgs",
  authDomain: "cervecera-tierra-grande.firebaseapp.com",
  databaseURL: "https://cervecera-tierra-grande-default-rtdb.firebaseio.com",
  projectId: "cervecera-tierra-grande",
  storageBucket: "cervecera-tierra-grande.firebasestorage.app",
  messagingSenderId: "243316014670",
  appId: "1:243316014670:web:0545ce0b0cb81f7af54d1f",
  measurementId: "G-8NDCKNGPB0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const RECETAS = {
  'r-stout':        { nombre:'Coffee Stout',                    fermentandoDays:8, fermenterDays:12, tiempoTotalDias:32, carbonatacionDias:14 },
  'r-belgian':      { nombre:'Belgian Blonde Albahaca-Romero',  fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24, carbonatacionDias:12 },
  'r-honey-wheat':  { nombre:'Honey Wheat',                    fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24, carbonatacionDias:12 },
  'r-dry-stout':    { nombre:'Dry Stout',                      fermentandoDays:7, fermenterDays:11, tiempoTotalDias:24, carbonatacionDias:14 },
};

function parseFecha(val){
  if(!val) return null;
  if(val instanceof Date) return isNaN(val.getTime()) ? null : val;
  if(typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)){
    const d = new Date(val.slice(0,10) + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  if(typeof val === 'number' || (typeof val === 'string' && /^\d+$/.test(val))){
    const n = Number(val);
    const d = new Date(n > 1e12 ? n : n * 1000);
    return isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function daysBetween(val){
  const start = parseFecha(val);
  if(!start) return 0;
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  return Math.max(0, Math.floor((nowMid - startMid) / 86400000));
}

function addDays(val, days){
  const d = parseFecha(val);
  if(!d) return null;
  const out = new Date(d.getTime());
  out.setDate(out.getDate() + days);
  return out;
}

function fmtDate(val){
  const d = val instanceof Date ? val : parseFecha(val);
  if(!d || isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'long', year:'numeric'});
}

function nombreReceta(recetaId, fallback){
  if(recetaId && RECETAS[recetaId]) return RECETAS[recetaId].nombre;
  return fallback || '—';
}

function esCarbonatando(estado){
  if(!estado) return false;
  const s = String(estado).toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.includes('carbonat') || s === 'condicionando' || s === 'bottle conditioning';
}

function cantidadTxt(botellas){
  const n = botellas != null && botellas !== '' ? Number(botellas) : null;
  if(!n || isNaN(n)) return '—';
  const litros = n * 0.355;
  return `${n} botella${n === 1 ? '' : 's'} · ≈ ${litros.toFixed(1)} L`;
}

function toList(raw){
  if(raw == null) return [];
  return Array.isArray(raw) ? raw.filter(Boolean) : Object.values(raw).filter(Boolean);
}

function cardFermentador(f){
  const receta = RECETAS[f.recetaId];
  if(!receta) return '';
  const dias = daysBetween(f.fechaInicio);

  let etapa, claseEtapa;
  if(dias < receta.fermentandoDays){
    etapa = 'Fermentando';
    claseEtapa = 'fermentando';
  } else if(dias < receta.fermenterDays){
    etapa = 'En reposo';
    claseEtapa = 'reposo';
  } else {
    etapa = 'Listo para embotellar';
    claseEtapa = 'listo';
  }

  const fechaEntrega = addDays(f.fechaInicio, receta.tiempoTotalDias);

  return `
    <div class="card">
      <div class="receta">${receta.nombre}</div>
      <span class="badge ${claseEtapa}">${etapa}</span>
      <div class="detail-row">
        <span class="lbl">Cantidad en elaboración</span>
        <span class="val">${cantidadTxt(f.botellas)}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Elaboración iniciada</span>
        <span class="val">${fmtDate(f.fechaInicio)}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Días de proceso</span>
        <span class="val">${dias} día${dias === 1 ? '' : 's'}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Fecha estimada de entrega</span>
        <span class="val">${fmtDate(fechaEntrega)}</span>
      </div>
    </div>
  `;
}

function cardCarbonatando(lote){
  const nombre = nombreReceta(lote.recetaId, lote.estilo || lote.nombre);
  const inicioCarb =
    lote.fechaCarbonatacion || lote.carbonatacion ||
    lote.fechaEmbotellado || lote.embotellado ||
    lote.fecha;
  const dias = daysBetween(inicioCarb);
  const receta = lote.recetaId && RECETAS[lote.recetaId] ? RECETAS[lote.recetaId] : null;
  const diasCarb = (receta && receta.carbonatacionDias) || 14;
  const listoAprox = addDays(inicioCarb, diasCarb);
  const botellas = lote.botellas != null ? lote.botellas : (lote.cantidad != null ? lote.cantidad : null);

  return `
    <div class="card">
      <div class="receta">${nombre}</div>
      ${lote.id ? `<div class="lote-id">Lote ${lote.id}</div>` : ''}
      <span class="badge carbonatando">Carbonatando</span>
      <div class="detail-row">
        <span class="lbl">Cantidad</span>
        <span class="val">${cantidadTxt(botellas)}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Inicio carbonatación</span>
        <span class="val">${fmtDate(inicioCarb)}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Días carbonatando</span>
        <span class="val">${dias} día${dias === 1 ? '' : 's'}</span>
      </div>
      <div class="detail-row">
        <span class="lbl">Listo estimado</span>
        <span class="val">${fmtDate(listoAprox)}</span>
      </div>
    </div>
  `;
}

function renderAll(fermentadores, lotes){
  const content = document.getElementById('content');

  const ocupados = toList(fermentadores).filter(f => f && f.estado === 'ocupado' && f.recetaId);
  const carbonatando = toList(lotes).filter(l => l && esCarbonatando(l.estado || l.status || l.fase));

  if(ocupados.length === 0 && carbonatando.length === 0){
    content.innerHTML = '<div class="empty">No hay lotes en producción ni en carbonatación en este momento.<br>El siguiente lote se anunciará aquí en cuanto arranque.</div>';
    return;
  }

  let html = '';

  if(ocupados.length){
    html += `<div class="section-title">En fermentador (${ocupados.length})</div>`;
    html += ocupados.map(cardFermentador).join('');
  }

  if(carbonatando.length){
    html += `<div class="section-title">Carbonatando (${carbonatando.length})</div>`;
    html += carbonatando.map(cardCarbonatando).join('');
  }

  content.innerHTML = html;
}

function showError(msg, detail){
  document.getElementById('content').innerHTML = `
    <div class="empty">
      No se pudo cargar la información en este momento.
      <div class="error-box">${msg}${detail ? '<br><br>' + detail : ''}</div>
    </div>`;
}

let cacheFermentadores = null;
let cacheLotes = null;
let fermentadoresReady = false;
let lotesReady = false;

function tryRender(){
  if(!fermentadoresReady || !lotesReady) return;
  try {
    renderAll(cacheFermentadores, cacheLotes);
    document.getElementById('updated').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-MX');
  } catch (e) {
    console.error(e);
    showError('Error al procesar los datos.', e.message);
  }
}

function empezarLectura(){
  db.ref('bitacora/fermentadores').on('value', snap => {
    cacheFermentadores = snap.val();
    fermentadoresReady = true;
    tryRender();
  }, err => {
    console.error('fermentadores:', err);
    fermentadoresReady = true;
    cacheFermentadores = null;
    tryRender();
  });

  db.ref('bitacora/lotes-bitacora').on('value', snap => {
    cacheLotes = snap.val();
    lotesReady = true;
    tryRender();
  }, err => {
    console.error('lotes-bitacora:', err);
    lotesReady = true;
    cacheLotes = null;
    tryRender();
  });
}

firebase.auth().signInAnonymously()
  .then(empezarLectura)
  .catch(err => {
    console.error('Error de autenticación:', err);
    showError('No se pudo iniciar sesión para consultar los datos.', err.message);
  });
</script>

</body>
</html>
