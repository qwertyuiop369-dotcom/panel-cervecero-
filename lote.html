};

function calcABV(ogStr, fgStr){
  const og = parseFloat(ogStr), fg = parseFloat(fgStr);
  if(!og || !fg || isNaN(og) || isNaN(fg)) return null;
  if(og < 0.99 || og > 1.2 || fg < 0.99 || fg > 1.2 || fg > og) return null;
  return Math.round((og - fg) * 131.25 * 10) / 10;
}

function parseFecha(val){
  if(!val) return null;
  if(val instanceof Date) return isNaN(val.getTime()) ? null : val;
  if(typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)){
    const d = new Date(val.slice(0,10) + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  if(typeof val === 'number' || (typeof val === 'string' && /^\d+$/.test(val))){
    const n = Number(val);
    const d = new Date(n > 1e12 ? n : n * 1000);
    return isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function fmtDate(val){
  const d = parseFecha(val);
  if(!d) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'long', year:'numeric'});
}

function addDays(val, days){
  const d = parseFecha(val);
  if(!d) return null;
  const out = new Date(d.getTime());
  out.setDate(out.getDate() + days);
  return out;
}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function normalizarEstado(raw){
  if(!raw) return null;
  const key = String(raw).toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '');
  return ESTADOS[key] || { label: String(raw), cls: 'badge-default' };
}

function render(lote){
  const content = document.getElementById('content');
  if(!lote){
    content.innerHTML = `<div class="card"><div class="empty">No encontramos información para este lote.<br>Verifica el código QR o contacta a la cervecería.</div></div>`;
    return;
  }

  let recetaId = lote.recetaId || null;
  let receta = (recetaId && RECETAS[recetaId]) ? RECETAS[recetaId] : null;

  if (!receta) {
    const textoBusqueda = ((lote.estilo || '') + ' ' + (lote.nombre || '')).toLowerCase();
    const matchKey = Object.keys(RECETAS).find(key => {
      const n = (RECETAS[key].nombre || '').toLowerCase();
      return n && textoBusqueda.includes(n);
    });
    if (matchKey) {
      recetaId = matchKey;
      receta = RECETAS[matchKey];
    }
  }

  const abvMedido = calcABV(lote.og, lote.fg);
  const abvTexto = abvMedido !== null
    ? (abvMedido + '% vol.')
    : ((receta && receta.abvEstimado) ? receta.abvEstimado : '—');
  const abvNota = abvMedido !== null
    ? ''
    : '<div class="abv-note">Valor estimado del estilo.</div>';

  let alertaHtml = '';
  if (receta) {
    const glutenFuentes = [...new Set(
      (receta.ingredientes || [])
        .map(i => (CATALOGO[i.id] || {}).gluten)
        .filter(Boolean)
    )];
    if (glutenFuentes.length) {
      alertaHtml = `<div class="alerta"><strong>Contiene gluten:</strong> ${glutenFuentes.join(', ')}. Elaborada en un espacio que también procesa otros cereales.</div>`;
    }
  }

  const consumoPreferente = fmtDate(addDays(lote.fecha, 180));
  const nombreCerveza = (receta && receta.nombre) || lote.estilo || lote.nombre || '—';
  const ibuTexto = (receta && receta.ibu) || lote.ibu || '—';
  const descripcionHtml = (receta && receta.descripcion)
    ? `<div class="descripcion"><strong>Descripción</strong>${receta.descripcion}</div>`
    : '';

  // Estado del lote (Firebase: estado / status / fase)
  const estadoInfo = normalizarEstado(lote.estado || lote.status || lote.fase);
  const badgeHtml = estadoInfo
    ? `<span class="badge ${estadoInfo.cls}">${estadoInfo.label}</span>`
    : '';

  // Temperatura y maridaje (lote > receta)
  const tempServicio = lote.tempServicio || lote.temperatura || (receta && receta.tempServicio) || null;
  const maridaje = lote.maridaje || (receta && receta.maridaje) || null;
  let tipsHtml = '';
  if (tempServicio || maridaje) {
    tipsHtml = '<div class="card"><h2>Cómo disfrutarla</h2>';
    if (tempServicio) {
      tipsHtml += `<div class="tip-box"><div class="tip-lbl">Temperatura de servicio</div>${tempServicio}</div>`;
    }
    if (maridaje) {
      tipsHtml += `<div class="tip-box"><div class="tip-lbl">Maridaje</div>${maridaje}</div>`;
    }
    tipsHtml += '</div>';
  }

  // Historial breve de trazabilidad
  const histParts = [];
  if (lote.fecha) histParts.push(`<span>Elaborado</span> ${fmtDate(lote.fecha)}`);
  if (lote.fechaCarbonatacion || lote.carbonatacion) {
    histParts.push(`<span>Carbonatado</span> ${fmtDate(lote.fechaCarbonatacion || lote.carbonatacion)}`);
  }
  if (lote.fechaEmbotellado || lote.embotellado) {
    histParts.push(`<span>Embotellado</span> ${fmtDate(lote.fechaEmbotellado || lote.embotellado)}`);
  }
  const historialHtml = histParts.length
    ? `<div class="card"><h2>Trazabilidad</h2><div class="historial">${histParts.join(' · ')}</div></div>`
    : '';

  const shareUrl = window.location.href;
  const shareText = encodeURIComponent(`${nombreCerveza} — Lote ${lote.id || ''} · Cerveza Locundus`);
  const waUrl = `https://wa.me/?text=${shareText}%20${encodeURIComponent(shareUrl)}`;

  content.innerHTML = `
    <div class="card">
      <h2>Cerveza</h2>
      <div class="estilo-nombre">${nombreCerveza}</div>
      <div class="folio-row">
        <span class="folio">Lote ${lote.id || '—'}</span>
        ${badgeHtml}
      </div>
      ${descripcionHtml}
    </div>

    <div class="card">
      <h2>Contenido alcohólico</h2>
      <div class="abv-row">
        <div class="abv-box"><span class="num">${abvTexto}</span><span class="lbl">ABV</span></div>
        <div class="abv-box"><span class="num">${ibuTexto}</span><span class="lbl">IBU</span></div>
        <div class="abv-box"><span class="num">355 ml</span><span class="lbl">Volumen</span></div>
      </div>
      ${abvNota}
    </div>

    <div class="card">
      <h2>Datos del lote</h2>
      <div class="detail-row"><span class="lbl">Fecha de elaboración</span><span class="val">${fmtDate(lote.fecha)}</span></div>

    ${historialHtml}
    ${tipsHtml}
    ${alertaHtml ? `<div class="card">${alertaHtml}</div>` : ''}

    <div class="card">
      <h2>Compartir</h2>
      <div class="share-row">
        <a class="share-btn" href="${waUrl}" target="_blank" rel="noopener">WhatsApp</a>
        <button type="button" class="share-btn" id="btnCopiar">Copiar enlace</button>
      </div>
    </div>

    <a class="catalog-link" href="https://wa.me/524731746210?text=${encodeURIComponent('Hola, me interesa conocer más cervezas de Locundus')}">Ver otras cervezas · WhatsApp</a>

    <div class="card" style="margin-top:12px">
      <p class="legal">
        <strong>Contiene alcohol.</strong> Prohibida su venta a menores de 18 años.<br>
        El abuso en el consumo de este producto es nocivo para la salud.
      </p>
    </div>
  `;

  // Actualizar título / OG para compartir
  document.title = `${nombreCerveza} · Lote ${lote.id || ''} — Locundus`;
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.setAttribute('content', document.title);

  const btn = document.getElementById('btnCopiar');
  if (btn) {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrl);
        btn.textContent = '¡Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar enlace';
          btn.classList.remove('copied');
        }, 2000);
      } catch (e) {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.textContent = '¡Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar enlace';
          btn.classList.remove('copied');
        }, 2000);
      }
    });
  }
}

async function buscarLote(loteId){
  try {
    const q = await db.ref('bitacora/lotes-bitacora')
      .orderByChild('id')
      .equalTo(loteId)
      .limitToFirst(1)
      .once('value');
    const val = q.val();
    if (val) {
      const first = Array.isArray(val) ? val.find(Boolean) : Object.values(val)[0];
      if (first) return first;
    }
  } catch (e) {
    console.warn('Consulta filtrada no disponible, usando fallback:', e && e.message);
  }

  const snap = await db.ref('bitacora/lotes-bitacora').once('value');
  const raw = snap.val();
  if (raw == null) return null;
  const lista = Array.isArray(raw) ? raw : Object.values(raw);
  return lista.find(l => l && String(l.id) === String(loteId)) || null;
}

firebase.auth().signInAnonymously()
  .then(async () => {
    const loteId = getParam('id');
    if (!loteId) {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="empty">Código QR incompleto.<br>Escanea de nuevo el código de la botella o contacta a la cervecería.</div>
        </div>`;
      return;
    }

    try {
      const lote = await buscarLote(loteId);
      if (!lote) {
        document.getElementById('content').innerHTML = `
          <div class="card">
            <div class="empty">
              No encontramos información para este lote.<br>
              Verifica el código QR o contacta a la cervecería.
            </div>
          </div>`;
        return;
      }
      render(lote);
    } catch (err) {
      console.error('Error al leer lotes:', err);
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="empty">
            No se pudo cargar la información del lote.<br>
            Intenta de nuevo más tarde o contacta a la cervecería.
          </div>
        </div>`;
    }
  })
  .catch(err => {
    console.error('Error de autenticación:', err);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="empty">
          No se pudo cargar la información del lote.<br>
          Intenta de nuevo más tarde.

  });
</script>
