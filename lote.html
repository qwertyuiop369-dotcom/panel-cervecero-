<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root {
  --bg: #0e0e0e;
  --card: #1f1f1f;
  --copper: #FF6200;
  --copper-light: #FF8533;
  --ink: #E8E8E8;
  --muted: #8a8a8a;
  --green: #3ecf4a;
  --red: #E6392B;
  --line: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #1a1a1a, #0e0e0e);
  font-family: 'Rajdhani', sans-serif;
  color: var(--ink);
  padding: 24px 16px 40px;
}
.wrap { max-width: 480px; margin: 0 auto; }
header { text-align: center; margin-bottom: 22px; }
header h1 {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 1.5em;
  color: var(--copper);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
header p { color: var(--muted); font-size: 0.9em; letter-spacing: 1px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px 20px;
  margin-bottom: 14px;
}
.card h2 {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 0.85em;
  color: var(--muted);
  margin-bottom: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.estilo-nombre {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 1.4em;
  font-weight: 600;
  color: var(--copper-light);
  margin-bottom: 4px;
}
.folio {
  font-family: 'Share Tech Mono', monospace;
  color: var(--muted);
  font-size: 0.85em;
}
.descripcion {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 0.92em;
  line-height: 1.5;
  color: var(--ink);
}
.descripcion strong {
  display: block;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 0.85em;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.abv-row { display:flex; gap:12px; margin-top: 4px; }
.abv-box {
  flex:1; text-align:center; background:#252525; border:1px solid var(--line);
  border-radius:6px; padding:14px 8px;
}
.abv-box .num {
  display:block; font-family:'Chakra Petch',sans-serif; font-size:1.6em;
  color: var(--copper); font-weight:700;
}
.abv-box .lbl { font-size:0.72em; color:var(--muted); margin-top:2px; letter-spacing:0.5px; text-transform:uppercase; }
.abv-note { font-size:0.78em; color:var(--muted); margin-top:8px; font-style:italic; }

.detail-row {
  display:flex; justify-content:space-between; padding:8px 0;
  border-top:1px solid var(--line); font-size:0.95em;
}
.detail-row:first-child{ border-top:none; }
.detail-row .lbl { color: var(--muted); }
.detail-row .val { font-family:'Share Tech Mono', monospace; }

.ing-list { list-style:none; font-size:0.92em; }
.ing-list li { padding:5px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; }
.ing-list li:first-child{ border-top:none; }
.ing-list .cant { color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:0.9em; }

.alerta {
  background:#2a1f10; border:1px solid #5a3d10; border-radius:6px;
  padding:12px 14px; font-size:0.88em; color:var(--copper-light); margin-top:12px;
}
.alerta strong { color:#ffce9e; }

.legal {
  font-size:0.82em; color:var(--muted); line-height:1.5; text-align:center;
}
.legal strong{ color:var(--red); }

.empty, .loading {
  text-align:center; color:var(--muted); padding:60px 10px; font-size:0.95em;
}
.footer { text-align:center; margin-top:24px; font-size:0.8em; color:#555; }
</style>
</head>

<script>document.getElementById("lastMod").textContent = "Última modificación: " + document.lastModified;</script>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA949Wrf0ErPiWYhGUx5Pk25M21dQZ7Dgs",
  authDomain: "cervecera-tierra-grande.firebaseapp.com",
  databaseURL: "https://cervecera-tierra-grande-default-rtdb.firebaseio.com",
  projectId: "cervecera-tierra-grande",

// Datos de referencia (sin costos ni info interna) — deben coincidir con las recetas del panel admin.
const RECETAS = {
  'r-stout':       { nombre:'Coffee Stout',                   abvEstimado:'5.0–5.5%', ibu:'32–38',
                      descripcion:'Cerveza artesanal de cuerpo medio-alto, elaborada con malta Pale Ale, Crystal, Light Chocolate y Roasted Barley. Su perfil tostado y de chocolate se enriquece con cold brew de café añadido al final de la fermentación, aportando aroma fresco a café sin amargor excesivo. Equilibrada con lúpulo Northern Brewer y levadura S-33.',
                      ingredientes:[
                        {id:'pale-ale',cantidad:1000},{id:'crystal',cantidad:150},{id:'light-chocolate',cantidad:120},
                        {id:'roasted-barley',cantidad:130},{id:'northern-brewer',cantidad:12},{id:'s-33',cantidad:1},
                        {id:'cold-brew',cantidad:450},{id:'azucar',cantidad:20},
                      ]},
  'r-belgian':     { nombre:'Belgian Blonde Albahaca-Romero', abvEstimado:'5.2–5.6%', ibu:'22–28',
                      descripcion:'Cerveza artesanal de carácter único, elaborada con una suave base de malta Pale Ale y trigo, enriquecida con avena para una textura sedosa. Su perfil aromático incorpora sutiles notas a miel y caramelo, equilibradas con infusiones frescas de albahaca y romero que aportan un toque herbal y refrescante. Puede presentar un ligero velo natural propio del trigo y la avena, al no estar filtrada.',
                      ingredientes:[
                        {id:'pale-ale',cantidad:900},{id:'wheat',cantidad:200},{id:'aromatic',cantidad:100},
                        {id:'honey-malt',cantidad:80},{id:'crystal-10',cantidad:50},{id:'avena',cantidad:50},
                        {id:'northern-brewer',cantidad:9},{id:'albahaca',cantidad:10},{id:'romero',cantidad:4},
                        {id:'s-33',cantidad:1},{id:'azucar',cantidad:23},
                      ]},
  'r-honey-wheat': { nombre:'Honey Wheat', abvEstimado:'5.0–5.3%', ibu:'15–18',
                      descripcion:'Cerveza de trigo ligera y refrescante, elaborada con malta Pale Ale, trigo, Honey malt y avena. La miel se incorpora al final del hervido para conservar su aroma delicado, dando un perfil suave, ligeramente dulce y muy bebible. De aspecto naturalmente turbio, característico de las cervezas de trigo sin filtrar. Ideal para días cálidos, con carbonatación media-alta y un toque frutal sutil de la levadura S-33.',
                      ingredientes:[
                        {id:'pale-ale',cantidad:700},{id:'wheat',cantidad:500},{id:'honey-malt',cantidad:80},
                        {id:'avena',cantidad:50},{id:'crystal-10',cantidad:30},{id:'northern-brewer',cantidad:6},
                        {id:'miel',cantidad:175},{id:'s-33',cantidad:1},{id:'azucar',cantidad:23},
                      ]},
  'r-dry-stout':   { nombre:'Dry Stout', abvEstimado:'4.2–4.6%', ibu:'30–36',
                      descripcion:'Stout seca estilo irlandés, elaborada con malta Pale Ale, Roasted Barley, Light Chocolate, Crystal y avena. Ofrece un carácter tostado limpio y seco, con amargor equilibrado del lúpulo Northern Brewer. Cuerpo medio-bajo, final seco y refrescante, perfecta para quien busca una stout clásica sin excesiva dulzura.',
                      ingredientes:[
                        {id:'pale-ale',cantidad:950},{id:'roasted-barley',cantidad:120},{id:'light-chocolate',cantidad:60},
                        {id:'crystal',cantidad:50},{id:'avena',cantidad:40},{id:'northern-brewer',cantidad:12},
                        {id:'s-33',cantidad:1},{id:'azucar',cantidad:19},
                      ]},
};

const CATALOGO = {
  'pale-ale':{nombre:'Malta Pale Ale', gluten:'cebada', unidad:' g'},
  'crystal':{nombre:'Crystal malt', gluten:'cebada', unidad:' g'},
  'crystal-10':{nombre:'Crystal 10', gluten:'cebada', unidad:' g'},
  'light-chocolate':{nombre:'Light Chocolate', gluten:'cebada', unidad:' g'},
  'roasted-barley':{nombre:'Roasted Barley', gluten:'cebada', unidad:' g'},
  'wheat':{nombre:'Wheat malt', gluten:'trigo', unidad:' g'},
  'aromatic':{nombre:'Aromatic malt (Aroma)', gluten:'cebada', unidad:' g'},
  'honey-malt':{nombre:'Honey malt', gluten:'cebada', unidad:' g'},
  'avena':{nombre:'Avena natural (hojuelas)', gluten:'avena', unidad:' g'},
  'northern-brewer':{nombre:'Lúpulo Northern Brewer', unidad:' g'},
  's-33':{nombre:'Levadura Fermentis S-33', unidad:' paq'},
  'azucar':{nombre:'Azúcar de cebado', unidad:' g'},
  'miel':{nombre:'Miel', unidad:' g'},
  'cold-brew':{nombre:'Cold brew de café', unidad:' ml'},
  'albahaca':{nombre:'Albahaca fresca', unidad:' g'},
  'romero':{nombre:'Romero fresco', unidad:' g'},
};

function calcABV(ogStr, fgStr){
  const og = parseFloat(ogStr), fg = parseFloat(fgStr);
  if(!og || !fg || isNaN(og) || isNaN(fg)) return null;
  if(og < 0.99 || og > 1.2 || fg < 0.99 || fg > 1.2 || fg > og) return null;
  return Math.round((og - fg) * 131.25 * 10) / 10;
}
function parseFecha(val){
  if(val === null || val === undefined || val === '') return null;
  // Ya es Date
  if(val instanceof Date) return isNaN(val.getTime()) ? null : val;
  const s = String(val).trim();
  // ISO yyyy-mm-dd
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  // dd/mm/yyyy o dd-mm-yyyy
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m){
    const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    return isNaN(d.getTime()) ? null : d;
  }
  // Timestamp numérico
  if(/^\d{10,13}$/.test(s)){
    const n = Number(s);
    const d = new Date(n < 1e12 ? n * 1000 : n);
    return isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(val){
  const d = parseFecha(val);
  if(!d) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'long', year:'numeric'});
}
function addDaysDate(val, days){
  const d = parseFecha(val);
  if(!d) return null;
  const out = new Date(d.getTime());
  out.setDate(out.getDate() + days);
  return out;
}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function render(lote){
  const content = document.getElementById('content');
  if(!lote){
    content.innerHTML = `<div class="card"><div class="empty">No encontramos información para este lote.<br>Verifica el código QR o contacta a la cervecería.</div></div>`;
    return;
  }

  // Intentar por recetaId; si falta, buscar por nombre/estilo del lote
  let recetaId = lote.recetaId || null;
  let receta = (recetaId && RECETAS[recetaId]) ? RECETAS[recetaId] : null;

  if (!receta) {
    const textoBusqueda = ((lote.estilo || '') + ' ' + (lote.nombre || '')).toLowerCase();
    const matchKey = Object.keys(RECETAS).find(key => {
      const n = (RECETAS[key].nombre || '').toLowerCase();
      return n && textoBusqueda.includes(n);
    });
    if (matchKey) {
      recetaId = matchKey;
      receta = RECETAS[matchKey];
    }
  }

  const abvMedido = calcABV(lote.og, lote.fg);
  const abvTexto = abvMedido !== null
    ? (abvMedido + '% vol.')
    : ((receta && receta.abvEstimado) ? receta.abvEstimado : '—');
  const etapa = (lote.etapa || '').toLowerCase();
  const etapaAvanzada = ['reposo', 'carbonatando', 'listo', 'entregado', 'embotellado'].some(e => etapa.includes(e));
  let abvNota = '';
  if (abvMedido === null && receta && receta.abvEstimado) {
    abvNota = etapaAvanzada
      ? '<div class="abv-note">ABV estimado según el estilo de la receta.</div>'
      : '<div class="abv-note">Valor estimado del estilo (sin lectura final de densidades en este lote).</div>';
  }

  let ingHtml = '';
  let alertaHtml = '';
  let recetaWarning = '';

  if (!receta) {
    recetaWarning = `
      <div class="alerta">
        <strong>Receta no encontrada.</strong><br>
        ID de receta recibido: <code>${lote.recetaId || '(vacío)'}</code><br>
        Nombre/estilo del lote: <code>${(lote.estilo || lote.nombre || '(vacío)')}</code><br>
        Revisa que el lote en Firebase tenga un <code>recetaId</code> válido
        (r-stout, r-belgian, r-honey-wheat o r-dry-stout) o un nombre que coincida con alguna receta.
      </div>`;
    ingHtml = '<li style="color:var(--muted)">No hay ingredientes disponibles para esta receta.</li>';
  } else {
    const ingredientes = receta.ingredientes || [];
    if (ingredientes.length === 0) {
      ingHtml = '<li style="color:var(--muted)">Esta receta no tiene ingredientes registrados.</li>';
    } else {
      ingHtml = ingredientes.map(i => {
        const cat = CATALOGO[i.id] || {nombre: i.id, unidad: ''};
        const cant = (i.cantidad !== undefined && i.cantidad !== null) ? i.cantidad : '—';
        return `<li><span>${cat.nombre}</span><span class="cant">${cant}${cat.unidad || ''}</span></li>`;
      }).join('');
    }

    const glutenFuentes = [...new Set(
      (receta.ingredientes || [])
        .map(i => (CATALOGO[i.id] || {}).gluten)
        .filter(Boolean)
    )];
    alertaHtml = glutenFuentes.length
      ? `<div class="alerta"><strong>Contiene gluten:</strong> ${glutenFuentes.join(', ')}. Elaborada en un espacio que también procesa otros cereales.</div>`
      : '';
  }

  const consumoPreferente = fmtDate(addDaysDate(lote.fecha || lote.fechaEmbotellado, 180));
  const nombreCerveza = (receta && receta.nombre) || lote.estilo || lote.nombre || '—';
  const ibuTexto = (receta && receta.ibu) || lote.ibu || '—';
  const descripcionHtml = (receta && receta.descripcion)
    ? `<div class="descripcion"><strong>Descripción</strong>${receta.descripcion}</div>`
    : '';

  content.innerHTML = `
    <div class="card">
      <h2>Cerveza</h2>
      <div class="estilo-nombre">${nombreCerveza}</div>
      <div class="folio">Lote ${lote.id || '—'}</div>
      ${descripcionHtml}
    </div>

    <div class="card">
      <h2>Contenido alcohólico</h2>
      <div class="abv-row">
        <div class="abv-box"><span class="num">${abvTexto}</span><span class="lbl">ABV</span></div>
        <div class="abv-box"><span class="num">${ibuTexto}</span><span class="lbl">IBU</span></div>
        <div class="abv-box"><span class="num">355 ml</span><span class="lbl">Volumen</span></div>
      </div>
      ${abvNota}
    </div>

    <div class="card">
      <h2>Datos del lote</h2>
      <div class="detail-row"><span class="lbl">Fecha de elaboración</span><span class="val">${fmtDate(lote.fecha)}</span></div>
      <div class="detail-row"><span class="lbl">Consumo preferente antes de</span><span class="val">${consumoPreferente}</span></div>
      ${recetaId ? `<div class="detail-row"><span class="lbl">Receta</span><span class="val">${recetaId}</span></div>` : ''}
    </div>

    ${recetaWarning ? `<div class="card">${recetaWarning}</div>` : ''}
    ${alertaHtml ? `<div class="card">${alertaHtml}</div>` : ''}

    <div class="card">
      <p class="legal">
        <strong>Contiene alcohol.</strong> Prohibida su venta a menores de 18 años.<br>
        El abuso en el consumo de este producto es nocivo para la salud.
      </p>
    </div>
  `;
}

firebase.auth().signInAnonymously()
  .then(async () => {
    const loteId = getParam('id');
    if (!loteId) {
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="empty">Código QR incompleto.<br>Falta el identificador del lote (<code>?id=...</code>).</div>
        </div>`;
      return;
    }

    try {
      const snap = await db.ref('bitacora/lotes-bitacora').once('value');
      const raw = snap.val();

      if (raw === null || raw === undefined) {
        document.getElementById('content').innerHTML = `
          <div class="card">
            <div class="empty">
              No hay lotes registrados en la base de datos.<br>
              Ruta: <code>bitacora/lotes-bitacora</code>
            </div>
          </div>`;
        return;
      }

      const lista = Array.isArray(raw) ? raw : Object.values(raw);
      const lote = lista.find(l => l && String(l.id) === String(loteId));

      if (!lote) {
        const idsDisponibles = lista
          .filter(l => l && l.id)
          .map(l => l.id)
          .slice(0, 8)
          .join(', ');
        document.getElementById('content').innerHTML = `
          <div class="card">
            <div class="empty">
              No encontramos el lote <strong>${loteId}</strong>.<br><br>
              ${idsDisponibles
                ? `Algunos lotes existentes: ${idsDisponibles}${lista.length > 8 ? '…' : ''}`
                : 'No se encontraron lotes con campo <code>id</code>.'}
            </div>
          </div>`;
        console.warn('Lote no encontrado:', loteId, 'Total lotes:', lista.length);
        return;
      }

      console.log('Lote cargado:', lote);
      render(lote);
    } catch (err) {
      console.error('Error al leer lotes:', err);
      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="empty">
            Error al consultar la base de datos.<br>
            ${err && err.message ? err.message : 'Intenta de nuevo más tarde.'}
          </div>
        </div>`;
    }
  })
  .catch(err => {
    console.error('Error de autenticación:', err);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="empty">
          No se pudo iniciar sesión para consultar los datos.<br>
          ${err && err.message ? err.message : ''}
        </div>
      </div>`;
  });
</script>
