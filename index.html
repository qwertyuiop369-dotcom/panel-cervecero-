<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervecería Tierra Grande</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root{
  /* Roland TR-808 palette */
  --bg1:#1a1a1a;
  --bg2:#0e0e0e;
  --card:#252525;
  --card-soft:#2e2e2e;
  --copper:#FF6200;
  --copper-light:#FF8533;
  --ink:#E8E8E8;
  --muted:#8a8a8a;
  --green:#3ecf4a;
  --green-dark:#2a9e36;
  --red:#E6392B;
  --line:#404040;
  --panel:#1f1f1f;
  --silver:#b0b0b0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:'Rajdhani',sans-serif;
  color:var(--ink);
  padding-bottom:60px;
}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 10px;}

header.top{text-align:center;margin-bottom:22px;}
header.top h1{
  font-family:'Chakra Petch',sans-serif;
  font-weight:700;
  font-size:2.1em;
  color:var(--copper);
  margin:0 0 4px;
  letter-spacing:2px;
  text-transform:uppercase;
}
header.top p{
  color:var(--silver);
  font-size:0.92em;
  margin:0;
  font-family:'Share Tech Mono',monospace;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav.tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:24px;
}
nav.tabs button{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  font-size:0.9em;
  padding:10px 20px;
  border-radius:4px;
  border:1.5px solid #3a3a3a;
  background:var(--panel);
  color:var(--silver);
  cursor:pointer;
  transition:all 0.15s ease;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
nav.tabs button:hover{background:#333;border-color:var(--copper);color:var(--copper-light);}
nav.tabs button.active{
  background:var(--copper);
  border-color:var(--copper);
  color:#111;
}

.card{
  background:var(--card);
  border-radius:6px;
  padding:20px 22px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  border:1px solid var(--line);
}
.card h2{
  font-family:'Chakra Petch',sans-serif;
  font-size:1.3em;
  margin:0 0 6px;
  color:var(--ink);
  letter-spacing:1px;
  text-transform:uppercase;
}
.card h3{
  font-family:'Chakra Petch',sans-serif;
  font-size:1.05em;
  margin:16px 0 8px;
  color:var(--copper);
  letter-spacing:0.5px;
}
.muted{color:var(--muted);font-size:0.88em;}
.badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:0.72em;
  padding:2px 8px;
  border-radius:3px;
  font-weight:600;
}
.badge.fresh{background:#3a3520;color:#e8c84a;}
.badge.green{background:#1a3320;color:var(--green);}
.badge.red{background:#3a1a18;color:var(--red);}
.badge.copper{background:#3a2208;color:var(--copper-light);}

.grid-recetas{display:grid;grid-template-columns:1fr;gap:16px;}
.receta-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:18px 20px;
  border:1px solid var(--line);
}
.receta-card h3{margin-top:0;}
.receta-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.receta-desc{font-size:0.88em;color:var(--muted);margin-bottom:10px;line-height:1.4;}
.ing-list{list-style:none;padding:0;margin:0 0 12px;font-family:'Share Tech Mono',monospace;font-size:0.8em;}
.ing-list li{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;}
.ing-list li:last-child{border-bottom:none;}
.proc-title{
  font-family:'Chakra Petch',sans-serif;
  font-size:0.95em;
  color:var(--copper);
  margin:12px 0 6px;
}
.proc-list{
  list-style:none;
  padding:0;
  margin:0;
  font-size:0.84em;
  line-height:1.45;
  color:var(--ink);
}
.proc-list li{
  padding:6px 0 6px 0;
  border-bottom:1px dashed var(--line);
  display:grid;
  grid-template-columns:28px 1fr;
  gap:8px;
}
.proc-list li:last-child{border-bottom:none;}
.proc-num{
  font-family:'Share Tech Mono',monospace;
  font-weight:600;
  color:var(--copper);
  font-size:0.9em;
}
.proc-why{
  display:block;
  margin-top:2px;
  font-size:0.92em;
  color:var(--muted);
  font-style:italic;
}
.params{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:8px 0 4px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.75em;
}
.params span{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:3px;
  padding:3px 8px;
  color:var(--silver);
}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0;}
.stat-box{
  background:var(--panel);
  border-radius:6px;
  padding:14px;
  text-align:center;
  border:1px solid var(--line);
}
.stat-box .num{
  font-family:'Share Tech Mono',monospace;
  font-weight:600;
  font-size:1.5em;
  color:var(--copper);
  display:block;
}
.stat-box .lbl{font-size:0.75em;color:var(--muted);margin-top:4px;display:block;}

.desglose{
  font-family:'Share Tech Mono',monospace;
  font-size:0.82em;
  color:var(--muted);
  margin:6px 0 14px;
}

.ing-row{
  display:grid;
  grid-template-columns:1.8fr 0.9fr 0.9fr 1fr;
  gap:10px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:0.85em;
}
.ing-row:last-child{border-bottom:none;}
.ing-row input[type=number]{
  width:100%;
  padding:6px 8px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  font-size:0.95em;
  background:var(--panel);
  color:var(--ink);
}
.ing-name{font-weight:600;}
.ing-aporta{font-family:'Share Tech Mono',monospace;color:var(--muted);font-size:0.85em;}

.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px;}
.config-field label{display:block;font-size:0.75em;color:var(--muted);margin-bottom:4px;font-family:'Share Tech Mono',monospace;}
.config-field input, .config-field select{
  width:100%;
  padding:8px 10px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  background:var(--panel);
  color:var(--ink);
}

button.btn{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  padding:10px 18px;
  border-radius:4px;
  border:none;
  background:var(--copper);
  color:#111;
  cursor:pointer;
  font-size:0.9em;
  margin-top:10px;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
button.btn:hover{background:var(--copper-light);}
button.btn:disabled{background:#444;color:#777;cursor:not-allowed;}
button.btn.secondary{background:transparent;border:1.5px solid var(--copper);color:var(--copper);}
button.btn.danger{background:var(--red);color:#fff;}

.grid-ferm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.ferm-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:18px;
  border:1px solid var(--line);
  text-align:center;
}
.ferm-card h3{margin-top:0;}
.ferm-select, .ferm-date{
  width:100%;
  padding:8px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Rajdhani',sans-serif;
  margin-bottom:8px;
  background:var(--panel);
  color:var(--ink);
}
.etapa-pill{
  display:inline-block;
  padding:5px 14px;
  border-radius:3px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.78em;
  font-weight:600;
  color:#111;
  margin:8px 0;
}

.entregas-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;}
.entregas-form .config-field input,.entregas-form select{
  width:100%;padding:8px;border-radius:3px;border:1px solid var(--line);font-family:'Rajdhani',sans-serif;background:var(--panel);color:var(--ink);
}
.hist-item{
  display:grid;
  grid-template-columns:1.3fr 1fr 0.7fr 0.8fr 0.8fr 0.45fr 0.45fr;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:0.86em;
}
.hist-item:last-child{border-bottom:none;}
.pill-pago{
  cursor:pointer;
  padding:4px 10px;
  border-radius:3px;
  font-size:0.75em;
  font-weight:700;
  text-align:center;
  font-family:'Share Tech Mono',monospace;
}
.pill-pago.pagado{background:#1a3320;color:var(--green);}
.pill-pago.pendiente{background:#3a1a18;color:var(--red);}
.icon-btn{background:none;border:none;cursor:pointer;font-size:1em;color:var(--muted);padding:4px;}
.icon-btn:hover{color:var(--red);}
.icon-btn.print:hover{color:var(--copper);}
@media print{
  body *{visibility:hidden;}
}

.loading{
  text-align:center;
  color:var(--copper-light);
  font-family:'Share Tech Mono',monospace;
  padding:60px 20px;
}

.lote-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:16px 18px;
  border:1px solid var(--line);
  border-left:5px solid var(--copper);
  margin-bottom:12px;
}
.lote-card.open{background:#333;}
.lote-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer;}
.lote-title{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1.1em;margin:0 0 2px;}
.lote-meta{font-family:'Share Tech Mono',monospace;font-size:0.75em;color:var(--muted);}
.stage-badge{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:0.72em;
  padding:5px 10px;border-radius:3px;white-space:nowrap;color:#111;
  display:inline-flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:0.5px;
}
.airlock-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bubble 1.8s ease-in-out infinite;}
@keyframes bubble{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.stage-done .airlock-dot{animation:none;}
.lote-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none;}
.lote-card.open .lote-body{display:block;}
.lote-body .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.lote-body .field-row-3{grid-template-columns:1fr 1fr 1fr;}
.lote-body .abv-display{
  font-family:'Share Tech Mono',monospace;font-size:0.95em;font-weight:600;color:var(--copper);
  padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;
}
.alerta-stock{border-left:4px solid var(--red);}
.alerta-stock h2{color:var(--red);}
.stock-bajo-list{margin:8px 0 0;padding-left:20px;}
.stock-bajo-list li{margin-bottom:4px;font-size:0.92em;}
.lote-body .field label{display:block;font-size:0.72em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.lote-body .field select,.lote-body .field input,.lote-body .field textarea{
  width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;font-size:0.85em;background:var(--panel);color:var(--ink);
}
.lote-body .field textarea{font-family:'Rajdhani',sans-serif;min-height:56px;resize:vertical;}
.qr-box{background:#252525;border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;}
.qr-box canvas{max-width:180px;margin:0 auto 10px;border-radius:4px;}
.qr-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.qr-actions .btn{text-decoration:none;display:inline-block;}
.lote-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap;}
.new-lote-form{display:none;margin-bottom:14px;}
.new-lote-form.show{display:block;}

.lote-check{
  background:var(--card-soft);
  border-radius:6px;
  padding:14px 16px;
  border:1px solid var(--line);
  margin-bottom:10px;
}
.lote-check h4{margin:0 0 6px;font-family:'Chakra Petch',sans-serif;}
.fecha-row{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap;
  margin-top:8px;
}
.fecha-row .config-field{flex:1;min-width:140px;}
.fecha-row .btn{margin-top:0;}

@media(max-width:680px){
  .ing-row{grid-template-columns:1fr 1fr;}
  .ing-row > *:nth-child(1){grid-column:1/3;}
  .hist-item{grid-template-columns:1fr 1fr;}
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🍺 Cervecería Tierra Grande</h1>
    <p>Bitácora de operación · nano brewery</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="content"><div class="loading">Cargando bitácora…</div></div>
</div>

<script>
// ======================= INVENTARIO ÚNICO =======================
const CATALOGO = [
  {id:'pale-ale',       nombre:'Malta Pale Ale',              unidad:'g',  fresco:false},

  {id:'light-chocolate',nombre:'Light Chocolate',             unidad:'g',  fresco:false},

  {id:'wheat',          nombre:'Wheat malt',                  unidad:'g',  fresco:false},
  {id:'aromatic',       nombre:'Aromatic malt (Aroma)',       unidad:'g',  fresco:false},
  {id:'honey-malt',     nombre:'Honey malt',                  unidad:'g',  fresco:false},
  {id:'avena',          nombre:'Avena natural (hojuelas)',    unidad:'g',  fresco:false},
  {id:'northern-brewer',nombre:'Lúpulo Northern Brewer',      unidad:'g',  fresco:false},
  {id:'s-33',           nombre:'Levadura Fermentis S-33',     unidad:'u',  fresco:false},
  {id:'azucar',         nombre:'Azúcar cebado',               unidad:'g',  fresco:false},
  {id:'miel',           nombre:'Miel',                        unidad:'g',  fresco:true},
  {id:'cold-brew',      nombre:'Cold brew café',              unidad:'ml', fresco:true},
  {id:'albahaca',       nombre:'Albahaca fresca',             unidad:'g',  fresco:true},
  {id:'romero',         nombre:'Romero fresco',               unidad:'g',  fresco:true},
];

const RECETAS = [
  {
    id:'r-stout', nombre:'Coffee Stout', variante:'All Grain · 15 botellas',
    tiempoTotal:'4-5 semanas + macerado', bottleYield:15, volumenL:5.5,
    descripcion:'Coffee Stout con Pale Ale, Crystal, Light Chocolate, Roasted Barley, Northern Brewer y S-33. Cold brew de café al final de fermentación.',
    fermentandoDays:8, fermenterDays:12,
    params:{ og:'1.052–1.058', fg:'1.014–1.018', abv:'5.0–5.5%', ibu:'32–38', mash:'66–67°C', ferm:'18–21°C' },
    ingredientes:[
      {id:'pale-ale',        cantidad:1000},
      {id:'crystal',         cantidad:150},
      {id:'light-chocolate', cantidad:120},
      {id:'roasted-barley',  cantidad:130},
      {id:'northern-brewer', cantidad:12},
      {id:'s-33',            cantidad:1},
      {id:'cold-brew',       cantidad:450},
      {id:'azucar',          cantidad:20},
    ],
    procedimiento:[
      {paso:'Agua de mash', detalle:'Calienta 10–10,5 L de agua a 72–74 °C (strike).', why:'Al añadir granos baja a la temperatura de macerado.'},
      {paso:'Macerado', detalle:'Añade todos los granos. Mantén 66–67 °C durante 60 min. pH objetivo 5,2–5,5.', why:'Temperatura que da cuerpo medio-alto típico de stout.'},
      {paso:'Mash-out', detalle:'Sube a 75–76 °C durante 10 min.', why:'Detiene enzimas y facilita el drenado.'},
      {paso:'Drenado', detalle:'Escurre la bolsa. Opcional: dunk sparge 1–1,5 L a 75–78 °C.', why:'Recupera azúcares y sube un poco la eficiencia.'},
      {paso:'Hervido 60 min', detalle:'A los 60 min añade 12 g Northern Brewer. Últimos 10–15 min: Whirlfloc si tienes.', why:'Isomeriza amargor limpio y elimina DMS.'},
      {paso:'Enfriado', detalle:'Baja a 18–20 °C lo más rápido posible.', why:'Evita contaminación y forma cold break.'},
      {paso:'Fermentación', detalle:'Siembra S-33. Fermenta a 18–21 °C. Primaria ~5–8 días.', why:'S-33 da cuerpo y fruta moderada; rango ideal de la levadura.'},
      {paso:'Café', detalle:'Días 4–6 (o cerca del FG) añade cold brew filtrado (450 ml).', why:'Conserva aroma a café fresco sin “cocinarlo”.'},
      {paso:'Embotellado', detalle:'Cuando FG esté estable (≈1.014–1.018): 18–20 g azúcar de cebado en 5,3 L.', why:'Carbonatación media de stout (~2,0–2,2 vol).'},
    ]
  },
  {
    id:'r-belgian', nombre:'Belgian Blonde Albahaca-Romero', variante:'All Grain · 15 botellas',
    tiempoTotal:'3-4 semanas + macerado', bottleYield:15, volumenL:5.5,
    descripcion:'Belgian Blonde con notas frescas de albahaca y romero. Pale Ale + Wheat + Aromatic + Honey malt + Crystal 10 + avena. Northern Brewer y S-33.',
    fermentandoDays:7, fermenterDays:11,
    params:{ og:'1.050–1.055', fg:'1.010–1.014', abv:'5.2–5.6%', ibu:'22–28', mash:'66–67°C', ferm:'18–21°C' },
    ingredientes:[
      {id:'pale-ale',        cantidad:900},
      {id:'wheat',           cantidad:200},
      {id:'aromatic',        cantidad:100},
      {id:'honey-malt',      cantidad:80},
      {id:'crystal-10',      cantidad:50},
      {id:'avena',           cantidad:50},
      {id:'northern-brewer', cantidad:9},
      {id:'albahaca',        cantidad:10},
      {id:'romero',          cantidad:4},
      {id:'s-33',            cantidad:1},
      {id:'azucar',          cantidad:23},
    ],
    procedimiento:[
      {paso:'Agua de mash', detalle:'Calienta 10–10,5 L a 72–73 °C.', why:'Strike para llegar a 66–67 °C al mash-in.'},
      {paso:'Macerado', detalle:'Añade todos los granos (avena incluida, sin hervir aparte). 66–67 °C × 60 min. pH 5,2–5,5.', why:'Cuerpo medio belga; trigo y avena mejoran espuma.'},
      {paso:'Mash-out', detalle:'75–76 °C durante 10 min.', why:'Facilita drenado del mosto viscoso con trigo/avena.'},
      {paso:'Drenado', detalle:'Escurre bien. Dunk sparge opcional 1–1,5 L a 75–78 °C.', why:'Mejora eficiencia en lote pequeño.'},
      {paso:'Hervido 60 min', detalle:'Min 60: 9 g Northern Brewer. Últimos 5 min: mitad de albahaca + todo el romero. Flameout: resto de albahaca.', why:'Amargor limpio; hierbas al final conservan aroma fresco.'},
      {paso:'Enfriado', detalle:'Baja a 18–20 °C rápidamente.', why:'Protege el mosto y permite sembrar levadura pronto.'},
      {paso:'Fermentación', detalle:'Siembra S-33 a 18–21 °C. Primaria 5–8 días.', why:'Ésteres frutales moderados típicos belgas.'},
      {paso:'Hierbas extra (opc.)', detalle:'Días 4–6 puedes añadir 3–4 g albahaca 2–3 días y retirar.', why:'Más aroma fresco tipo dry-hop.'},
      {paso:'Embotellado', detalle:'FG estable ≈1.010–1.014. Priming 22–25 g azúcar (~2,4–2,6 vol).', why:'Carbonatación belga media-alta.'},
    ]
  },
  {
    id:'r-honey-wheat', nombre:'Honey Wheat', variante:'All Grain · 15 botellas',
    tiempoTotal:'3-4 semanas + macerado', bottleYield:15, volumenL:5.5,
    descripcion:'Trigo ligero y refrescante con notas de miel. Pale Ale + Wheat + Honey malt + avena + miel al final del hervido. Northern Brewer y S-33.',
    fermentandoDays:7, fermenterDays:11,
    params:{ og:'1.048–1.052', fg:'1.010–1.014', abv:'5.0–5.3%', ibu:'15–18', mash:'66–67°C', ferm:'18–20°C' },
    ingredientes:[
      {id:'pale-ale',        cantidad:700},
      {id:'wheat',           cantidad:500},

async function loadKey(key, fallback) {
  try {
    const snapshot = await db.ref('bitacora/' + key).once('value');
    const val = snapshot.val();
    if (val !== null && val !== undefined) return val;
    return fallback;
  } catch (e) {
    console.error('Error cargando ' + key, e);
    return fallback;
  }
}

async function saveKey(key, value) {
  try {
    await db.ref('bitacora/' + key).set(value);
  } catch (e) {
    console.error('Error guardando ' + key, e);
  }
}

function fmtMoney(n){
  if(isNaN(n)) n = 0;
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function daysBetween(iso){
  if(!iso) return 0;
  const start = new Date(iso + 'T00:00:00');
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMid - start) / 86400000);
}
function addDaysISO(iso, days){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmtDateShort(d){
  if(!d) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
}
function getReceta(id){ return RECETAS.find(r=>r.id===id); }
function getCatalogo(id){ return CATALOGO.find(c=>c.id===id); }

function getIngredientesStockBajo(){
  const bajos = [];
  CATALOGO.forEach(cat=>{
    if(cat.fresco) return;
    const data = state.inventario[cat.id] || {stock:0, precio:0};
    let minLotes = null;
    RECETAS.forEach(r=>{
      const scaled = getScaledIngredients(r.id).find(i=>i.id===cat.id);
      if(scaled && scaled.cantidad > 0){
        const lotes = Math.floor((data.stock||0) / scaled.cantidad);
        if(minLotes === null || lotes < minLotes) minLotes = lotes;
      }
    });
    if(minLotes !== null && minLotes <= 1){
      bajos.push({ nombre: cat.nombre, lotes: minLotes, stock: data.stock||0, unidad: cat.unidad });
    }
  });
  return bajos.sort((a,b)=>a.lotes-b.lotes);
}

/** Factor de escala: botellas deseadas / botellas base de la receta */
function getScaleFactor(recipeId){
  const receta = getReceta(recipeId);
  if(!receta || !receta.bottleYield) return 1;
  const botellas = state.escalas[recipeId];
  const n = (botellas !== undefined && botellas !== null) ? Number(botellas) : receta.bottleYield;
  if(!n || n <= 0) return 1;
  return n / receta.bottleYield;
}

function getBotellas(recipeId){
  const receta = getReceta(recipeId);
  const n = state.escalas[recipeId];
  if(n !== undefined && n !== null && Number(n) > 0) return Number(n);
  return receta ? receta.bottleYield : 15;
}

function getVolumenL(recipeId){
  const receta = getReceta(recipeId);
  return (receta.volumenL || 5.5) * getScaleFactor(recipeId);
}

/** Cantidad escalada de un ingrediente (g/ml redondeados; levadura mínimo 1) */
function scaleCantidad(recipeId, ing){
  const factor = getScaleFactor(recipeId);
  const raw = ing.cantidad * factor;
  if(ing.id === 's-33') return Math.max(1, Math.round(raw));
  if(raw < 10) return Math.round(raw * 10) / 10; // 1 decimal para cantidades pequeñas
  return Math.round(raw);
}

function getScaledIngredients(recipeId){
  const receta = getReceta(recipeId);
  return receta.ingredientes.map(ing=>({
    id: ing.id,
    cantidad: scaleCantidad(recipeId, ing),
  }));
}

function calcLotesPosibles(recipeId){
  const receta = getReceta(recipeId);
  let minLotes = Infinity;
  getScaledIngredients(recipeId).forEach(ing=>{
    const cat = getCatalogo(ing.id);
    if(cat && cat.fresco) return;
    const stock = (state.inventario[ing.id] && state.inventario[ing.id].stock) || 0;
    const lotes = ing.cantidad > 0 ? Math.floor(stock / ing.cantidad) : 0;
    if(lotes < minLotes) minLotes = lotes;
  });
  if(!isFinite(minLotes)) minLotes = 0;
  return minLotes;
}

function calcCostoIngredientes(recipeId){
  let total = 0;
  getScaledIngredients(recipeId).forEach(ing=>{
    const precio = (state.inventario[ing.id] && state.inventario[ing.id].precio) || 0;
    total += precio * ing.cantidad;
  });
  return total;
}

function calcCostoElectricidad(){
  return (state.config.ollaW/1000) * state.config.horasProceso * (state.config.precioElec || 0);
}
function calcCostoAgua(){
  return state.config.litrosAgua * (state.config.precioAgua || 0);
}
function calcCostoLote(recipeId){
  const ing = calcCostoIngredientes(recipeId);
  const elec = calcCostoElectricidad();
  const agua = calcCostoAgua();
  return { ing, elec, agua, total: ing + elec + agua };
}

function renderTabs(){
  const tabs = [
    {id:'recetas', label:'Recetas'},
    {id:'inventario', label:'Inventario'},
    {id:'fermentadores', label:'Fermentadores'},
    {id:'bitacora', label:'Bitácora'},
    {id:'entregas', label:'Entregas'},
  ];
  const el = document.getElementById('tabs');
  el.innerHTML = tabs.map(t => `<button data-tab="${t.id}" class="${state.currentTab===t.id?'active':''}">${t.label}</button>`).join('');
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.currentTab = btn.dataset.tab;
      renderTabs();
      renderContent();
    });
  });
}

function renderContent(){
  const el = document.getElementById('content');
  if(state.currentTab === 'recetas') { el.innerHTML = renderRecetas(); bindEscalaEvents(); }
  else if(state.currentTab === 'inventario') { el.innerHTML = renderInventario(); bindInventarioEvents(); bindEscalaEvents(); }
  else if(state.currentTab === 'fermentadores') { el.innerHTML = renderFermentadores(); bindFermentadoresEvents(); }
  else if(state.currentTab === 'bitacora') { el.innerHTML = renderBitacora(); bindBitacoraEvents(); }
  else if(state.currentTab === 'entregas') { el.innerHTML = renderEntregas(); bindEntregasEvents(); }
}

function bindEscalaEvents(){
  document.querySelectorAll('.escala-input').forEach(inp=>{

      const id = inp.dataset.escala;
      let n = parseInt(inp.value, 10);
      if(!n || n < 1) n = 1;
      state.escalas[id] = n;
      await saveKey('escalas-recetas', state.escalas);
      renderContent();
    });
  });
}

        await saveKey('config-costos', state.config);
        renderContent();
      });
    }
  });

  document.querySelectorAll('.inv-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const ingId = inp.dataset.ing;
      const field = inp.dataset.field;
      if(!state.inventario[ingId]) state.inventario[ingId] = {stock:0, precio:0};
      state.inventario[ingId][field] = parseFloat(inp.value) || 0;
      await saveKey('inventario-unico', state.inventario);
      renderContent();
    });
  });

  document.querySelectorAll('[data-registrar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const recipeId = btn.dataset.registrar;
      const fechaInput = document.getElementById('fecha-reg-'+recipeId);
      const fecha = (fechaInput && fechaInput.value) ? fechaInput.value : todayISO();
      await registrarCocimiento(recipeId, fecha);
    });
  });
}

async function registrarCocimiento(recipeId, fecha){
  const lotesPos = calcLotesPosibles(recipeId);
  const fermentadorLibre = state.fermentadores.find(f=>f.estado==='libre');
  if(lotesPos < 1 || !fermentadorLibre) return;

  const fechaInicio = fecha || todayISO();
  const scaled = getScaledIngredients(recipeId);
  const receta = getReceta(recipeId);
  const botellas = getBotellas(recipeId);

  scaled.forEach(ing=>{
    const cat = getCatalogo(ing.id);
    if(cat && cat.fresco) return;
    if(!state.inventario[ing.id]) state.inventario[ing.id] = {stock:0, precio:0};
    state.inventario[ing.id].stock = Math.max(0, (state.inventario[ing.id].stock || 0) - ing.cantidad);
  });
  await saveKey('inventario-unico', state.inventario);

  fermentadorLibre.estado = 'ocupado';
  fermentadorLibre.recetaId = recipeId;
  fermentadorLibre.fechaInicio = fechaInicio;
  fermentadorLibre.botellas = botellas;
  await saveKey('fermentadores', state.fermentadores);

  // Crear entrada automática en bitácora
  const loteId = 'l' + Date.now();
  state.lotes.unshift({
    id: loteId,
    nombre: receta.nombre + ' · ' + botellas + ' bot.',
    estilo: receta.nombre,
    recetaId: recipeId,
    fecha: fechaInicio,
    botellas: botellas,
    fermentadorId: fermentadorLibre.id,
    og: (receta.params && receta.params.og) ? receta.params.og.split('–')[0].trim() : '',
    fg: '',
    notas: '',
    etapa: 'fermentando',
  });
  fermentadorLibre.loteId = loteId;
  await saveKey('lotes-bitacora', state.lotes);
  await saveKey('fermentadores', state.fermentadores);

  renderContent();
}

function etapaInfo(key){
  return ETAPAS_LOTE.find(s=>s.key===key) || ETAPAS_LOTE[0];
}

function fmtDateBit(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-MX', {day:'2-digit', month:'short', year:'numeric'});
}

function calcABV(ogStr, fgStr){
  const og = parseFloat(ogStr);
  const fg = parseFloat(fgStr);
  if(!og || !fg || isNaN(og) || isNaN(fg)) return null;
  if(og < 0.99 || og > 1.2 || fg < 0.99 || fg > 1.2) return null; // fuera de rango plausible
  if(fg > og) return null; // FG no puede ser mayor que OG
  const abv = (og - fg) * 131.25;
  return Math.round(abv * 10) / 10;
}

function fmtABV(ogStr, fgStr){
  const abv = calcABV(ogStr, fgStr);
  return abv === null ? '—' : `${abv}%`;
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderFermentadores(){

      let etapa, color;
      if(dias < receta.fermentandoDays){ etapa = 'Fermentando'; color = 'var(--copper)'; }
      else if(dias < receta.fermenterDays){ etapa = 'Reposo / integración'; color = 'var(--green)'; }
      else { etapa = 'Listo para embotellar'; color = 'var(--green-dark)'; }
      const fechaListo = addDaysISO(f.fechaInicio, receta.fermenterDays);
      const diasFaltan = receta.fermenterDays - dias;
      const listoTexto = dias >= receta.fermenterDays
        ? `Listo desde el ${fmtDateShort(fechaListo)}`
        : `Listo aprox. el ${fmtDateShort(fechaListo)} (en ${diasFaltan} día${diasFaltan===1?'':'s'})`;
      return `
        <div class="ferm-card">
          <h3>Fermentador ${f.id}</h3>
          <span class="badge copper">OCUPADO</span>
          <div style="margin-top:8px;font-weight:600;">${receta.nombre}${f.botellas ? ` · ${f.botellas} bot.` : ''}</div>

}

function calcGananciaNeta(){
  const ingresos = state.entregas.reduce((s,e)=>s + (e.precio||0), 0);
  let costoProduccion = 0;
  let lotesSinCosto = 0;
  state.lotes.forEach(l=>{
    if(!l.recetaId){ lotesSinCosto++; return; }
    const receta = getReceta(l.recetaId);
    if(!receta){ lotesSinCosto++; return; }
    const costo = calcCostoLote(l.recetaId);
    const botellasBase = getBotellas(l.recetaId);
    const costoBotella = botellasBase > 0 ? costo.total / botellasBase : 0;
    costoProduccion += costoBotella * (l.botellas || 0);
  });
  return {
    ingresos,
    costoProduccion,
    neta: ingresos - costoProduccion,
    lotesSinCosto,
  };
}

      <div><span class="pill-pago ${e.pagado?'pagado':'pendiente'}" data-toggle-pago="${idx}">${e.pagado?'Pagado':'Pendiente'}</span></div>
      <div><button class="icon-btn print" data-print="${idx}" title="Imprimir recibo">🖨</button></div>
      <div><button class="icon-btn" data-delete="${idx}" title="Eliminar">🗑</button></div>
    </div>
  `).join('') || '<p class="muted">Aún no hay entregas registradas.</p>';

  const ganancia = calcGananciaNeta();

  return `
    <div class="card">
      <h2>Entregas</h2>
      <div class="config-field" style="max-width:320px;">
        <label>Cliente</label>
        <input type="text" id="entregas-cliente" value="${state.entregasCliente}">
      </div>
      <p class="muted">Contrato base: 15 botellas por entrega. Usa el botón 🖨 para imprimir recibo del cliente.</p>
      <div class="stats-row">
        <div class="stat-box"><span class="num">${totalBotellas}</span><span class="lbl">Botellas entregadas (histórico)</span></div>
        <div class="stat-box"><span class="num">${fmtMoney(totalPendiente)}</span><span class="lbl">Pendiente de cobro</span></div>
        <div class="stat-box"><span class="num">${fmtMoney(ganancia.neta)}</span><span class="lbl">Ganancia neta estimada</span></div>
      </div>
      <p class="muted" style="font-size:0.82em;">Ganancia = ingresos de todas las entregas (${fmtMoney(ganancia.ingresos)}) − costo de producción de los lotes en Bitácora a precios actuales (${fmtMoney(ganancia.costoProduccion)}).${ganancia.lotesSinCosto ? ` ${ganancia.lotesSinCosto} lote(s) sin receta asociada no se incluyeron en el costo.` : ''} Es una estimación, no contabilidad exacta.</p>

      <h3>Nueva entrega</h3>
      <div class="entregas-form">
        <div class="config-field"><label>Fecha</label><input type="date" id="ent-fecha" value="${todayISO()}"></div>
        <div class="config-field"><label>Sabor</label><select id="ent-sabor">${saborOptions}</select></div>
        <div class="config-field"><label>Botellas</label><input type="number" id="ent-botellas" value="15"></div>
        <div class="config-field"><label>Precio del lote</label><input type="number" id="ent-precio" value="600"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="btn-agregar-entrega">Agregar entrega</button>
          <button class="btn secondary" id="btn-agregar-imprimir">Agregar e imprimir</button>
        </div>
      </div>

      <h3>Historial</h3>
      ${historial}
    </div>
  `;
}

function bindEntregasEvents(){
  const clienteInput = document.getElementById('entregas-cliente');
  clienteInput.addEventListener('change', async ()=>{
    state.entregasCliente = clienteInput.value;
    await saveKey('entregas-cliente', state.entregasCliente);
  });

  async function agregarEntrega(imprimir){
    const fecha = document.getElementById('ent-fecha').value || todayISO();
    const sabor = document.getElementById('ent-sabor').value;
    const botellas = parseInt(document.getElementById('ent-botellas').value) || 0;
    const precio = parseFloat(document.getElementById('ent-precio').value) || 0;
    const nueva = { fecha, sabor, botellas, precio, pagado:false };
    state.entregas.unshift(nueva);
    await saveKey('entregas', state.entregas);
    if(imprimir) imprimirRecibo(nueva);
    renderContent();
  }

  document.getElementById('btn-agregar-entrega').addEventListener('click', async ()=>{
    await agregarEntrega(false);
  });
  document.getElementById('btn-agregar-imprimir').addEventListener('click', async ()=>{
    await agregarEntrega(true);
  });

  document.querySelectorAll('[data-toggle-pago]').forEach(pill=>{
    pill.addEventListener('click', async ()=>{
      const idx = parseInt(pill.dataset.togglePago);
      state.entregas[idx].pagado = !state.entregas[idx].pagado;
      await saveKey('entregas', state.entregas);
      renderContent();
    });
  });

  document.querySelectorAll('[data-print]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.print);
      imprimirRecibo(state.entregas[idx]);
    });
  });

  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.delete);
      state.entregas.splice(idx,1);
      await saveKey('entregas', state.entregas);
      renderContent();
    });
  });
}

authReady.then(() => { init(); });
</script>
</body>
</html>
