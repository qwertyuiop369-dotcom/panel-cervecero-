<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervecería Tierra Grande</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root{
  /* Roland TR-808 palette */
  --bg1:#1a1a1a;
  --bg2:#0e0e0e;
  --card:#252525;
  --card-soft:#2e2e2e;
  --copper:#FF6200;
  --copper-light:#FF8533;
  --ink:#E8E8E8;
  --muted:#8a8a8a;
  --green:#3ecf4a;
  --green-dark:#2a9e36;
  --red:#E6392B;
  --line:#404040;
  --panel:#1f1f1f;
  --silver:#b0b0b0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:'Rajdhani',sans-serif;
  color:var(--ink);
  padding-bottom:60px;
}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 10px;}

header.top{text-align:center;margin-bottom:22px;}
header.top .logo{
  width:120px;
  height:120px;
  object-fit:contain;
  margin:0 auto 10px;
  display:block;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,0.45));
}
header.top h1{
  font-family:'Chakra Petch',sans-serif;
  font-weight:700;
  font-size:2.1em;
  color:var(--copper);
  margin:0 0 4px;
  letter-spacing:2px;
  text-transform:uppercase;
}
header.top p{
  color:var(--silver);
  font-size:0.92em;
  margin:0;
  font-family:'Share Tech Mono',monospace;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav.tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:24px;
}
nav.tabs button{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  font-size:0.9em;
  padding:10px 20px;
  border-radius:4px;
  border:1.5px solid #3a3a3a;
  background:var(--panel);
  color:var(--silver);
  cursor:pointer;
  transition:all 0.15s ease;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
nav.tabs button:hover{background:#333;border-color:var(--copper);color:var(--copper-light);}
nav.tabs button.active{
  background:var(--copper);
  border-color:var(--copper);
  color:#111;
}

.card{
  background:var(--card);
  border-radius:6px;
  padding:20px 22px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  border:1px solid var(--line);
}
.card h2{
  font-family:'Chakra Petch',sans-serif;
  font-size:1.3em;
  margin:0 0 6px;
  color:var(--ink);
  letter-spacing:1px;
  text-transform:uppercase;
}
.card h3{
  font-family:'Chakra Petch',sans-serif;
  font-size:1.05em;
  margin:16px 0 8px;
  color:var(--copper);
  letter-spacing:0.5px;
}
.muted{color:var(--muted);font-size:0.88em;}
.badge{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:0.72em;
  padding:2px 8px;
  border-radius:3px;
  font-weight:600;
}
.badge.fresh{background:#3a3520;color:#e8c84a;}
.badge.green{background:#1a3320;color:var(--green);}
.badge.red{background:#3a1a18;color:var(--red);}
.badge.copper{background:#3a2208;color:var(--copper-light);}

.grid-recetas{display:grid;grid-template-columns:1fr;gap:16px;}
.receta-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:18px 20px;
  border:1px solid var(--line);
}
.receta-card h3{margin-top:0;}
.receta-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.receta-desc{font-size:0.88em;color:var(--muted);margin-bottom:10px;line-height:1.4;}
.ing-list{list-style:none;padding:0;margin:0 0 12px;font-family:'Share Tech Mono',monospace;font-size:0.8em;}
.ing-list li{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;}
.ing-list li:last-child{border-bottom:none;}
.proc-title{
  font-family:'Chakra Petch',sans-serif;
  font-size:0.95em;
  color:var(--copper);
  margin:12px 0 6px;
}
.proc-list{
  list-style:none;
  padding:0;
  margin:0;
  font-size:0.84em;
  line-height:1.45;
  color:var(--ink);
}
.proc-list li{
  padding:6px 0 6px 0;
  border-bottom:1px dashed var(--line);
  display:grid;
  grid-template-columns:28px 1fr;
  gap:8px;
}
.proc-list li:last-child{border-bottom:none;}
.proc-num{
  font-family:'Share Tech Mono',monospace;
  font-weight:600;
  color:var(--copper);
  font-size:0.9em;
}
.proc-why{
  display:block;
  margin-top:2px;
  font-size:0.92em;
  color:var(--muted);
  font-style:italic;
}
.params{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:8px 0 4px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.75em;
}
.params span{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:3px;
  padding:3px 8px;
  color:var(--silver);
}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0;}
.stat-box{
  background:var(--panel);
  border-radius:6px;
  padding:14px;
  text-align:center;
  border:1px solid var(--line);
}
.stat-box .num{
  font-family:'Share Tech Mono',monospace;
  font-weight:600;
  font-size:1.5em;
  color:var(--copper);
  display:block;
}
.stat-box .lbl{font-size:0.75em;color:var(--muted);margin-top:4px;display:block;}

.desglose{
  font-family:'Share Tech Mono',monospace;
  font-size:0.82em;
  color:var(--muted);
  margin:6px 0 14px;
}

.ing-row{
  display:grid;
  grid-template-columns:1.8fr 0.9fr 0.9fr 1fr;
  gap:10px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:0.85em;
}
.ing-row:last-child{border-bottom:none;}
.ing-row input[type=number]{
  width:100%;
  padding:6px 8px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  font-size:0.95em;
  background:var(--panel);
  color:var(--ink);
}
.ing-name{font-weight:600;}
.ing-aporta{font-family:'Share Tech Mono',monospace;color:var(--muted);font-size:0.85em;}

.venta-row{
  display:grid;
  grid-template-columns:1.6fr 0.8fr 0.8fr 0.8fr auto;
  gap:10px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:0.85em;
}
.venta-row:last-child{border-bottom:none;}
.venta-row input[type=number]{
  width:100%;
  padding:6px 8px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  font-size:0.95em;
  background:var(--panel);
  color:var(--ink);
}
.venta-row .btn{margin-top:0;padding:8px 12px;font-size:0.78em;}
@media (max-width:600px){
  .venta-row{grid-template-columns:1fr 1fr;}
  .venta-row > *:nth-child(1){grid-column:1/3;}
  .venta-row > button{grid-column:1/3;}
}

.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px;}
.config-field label{display:block;font-size:0.75em;color:var(--muted);margin-bottom:4px;font-family:'Share Tech Mono',monospace;}
.config-field input, .config-field select{
  width:100%;
  padding:8px 10px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  background:var(--panel);
  color:var(--ink);
}

button.btn{
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  padding:10px 18px;
  border-radius:4px;
  border:none;
  background:var(--copper);
  color:#111;
  cursor:pointer;
  font-size:0.9em;
  margin-top:10px;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
button.btn:hover{background:var(--copper-light);}
button.btn.btn-danger{background:#a83232;color:#fff;}
button.btn.btn-danger:hover{background:#c23f3f;}
button.btn:disabled{background:#444;color:#777;cursor:not-allowed;}
button.btn.secondary{background:transparent;border:1.5px solid var(--copper);color:var(--copper);}
button.btn.danger{background:var(--red);color:#fff;}

.enlaces-externos{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:22px;
}
.enlace-ext{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Chakra Petch',sans-serif;
  font-weight:600;
  font-size:0.82em;
  padding:9px 16px;
  border-radius:4px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--silver);
  text-decoration:none;
  letter-spacing:0.4px;
  text-transform:uppercase;
  transition:all 0.15s ease;
}
.enlace-ext:hover{border-color:var(--copper);color:var(--copper-light);background:#2a2a2a;}
.enlace-ext .ico{font-size:1.1em;}

.tecnico-box{
  border:1px dashed var(--line);
  border-radius:6px;
  margin-bottom:14px;
  overflow:hidden;
  background:rgba(255,98,0,0.03);
}
.tecnico-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  cursor:pointer;
  font-family:'Chakra Petch',sans-serif;
  font-size:0.85em;
  color:var(--copper-light);
  letter-spacing:0.3px;
}
.tecnico-head:hover{background:rgba(255,98,0,0.06);}
.tecnico-caret{color:var(--muted);}
.tecnico-body{padding:0 14px 14px;}
.lote-body .tecnico-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}

.grid-ferm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.ferm-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:18px;
  border:1px solid var(--line);
  text-align:center;
}
.ferm-card h3{margin-top:0;}
.ferm-select, .ferm-date{
  width:100%;
  padding:8px;
  border-radius:3px;
  border:1px solid var(--line);
  font-family:'Rajdhani',sans-serif;
  margin-bottom:8px;
  background:var(--panel);
  color:var(--ink);
}
.etapa-pill{
  display:inline-block;
  padding:5px 14px;
  border-radius:3px;
  font-family:'Share Tech Mono',monospace;
  font-size:0.78em;
  font-weight:600;
  color:#111;
  margin:8px 0;
}

.entregas-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;}
.entregas-form .config-field input,.entregas-form select{
  width:100%;padding:8px;border-radius:3px;border:1px solid var(--line);font-family:'Rajdhani',sans-serif;background:var(--panel);color:var(--ink);
}
.hist-item{
  display:grid;
  grid-template-columns:1.3fr 1fr 0.7fr 0.8fr 0.8fr 0.45fr 0.45fr;
  align-items:center;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:0.86em;
}
.hist-item:last-child{border-bottom:none;}
.pill-pago{
  cursor:pointer;
  padding:4px 10px;
  border-radius:3px;
  font-size:0.75em;
  font-weight:700;
  text-align:center;
  font-family:'Share Tech Mono',monospace;
}
.pill-pago.pagado{background:#1a3320;color:var(--green);}
.pill-pago.pendiente{background:#3a1a18;color:var(--red);}
.icon-btn{background:none;border:none;cursor:pointer;font-size:1em;color:var(--muted);padding:4px;}
.icon-btn:hover{color:var(--red);}
.icon-btn.print:hover{color:var(--copper);}
@media print{
  body *{visibility:hidden;}
}

.loading{
  text-align:center;
  color:var(--copper-light);
  font-family:'Share Tech Mono',monospace;
  padding:60px 20px;
}

.lote-card{
  background:var(--card-soft);
  border-radius:6px;
  padding:16px 18px;
  border:1px solid var(--line);
  border-left:5px solid var(--copper);
  margin-bottom:12px;
}
.lote-card.open{background:#333;}
.lote-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer;}
.lote-title{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1.1em;margin:0 0 2px;}
.lote-meta{font-family:'Share Tech Mono',monospace;font-size:0.75em;color:var(--muted);}
.stage-badge{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:0.72em;
  padding:5px 10px;border-radius:3px;white-space:nowrap;color:#111;
  display:inline-flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:0.5px;
}
.airlock-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bubble 1.8s ease-in-out infinite;}
@keyframes bubble{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.stage-done .airlock-dot{animation:none;}
.lote-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none;}
.lote-card.open .lote-body{display:block;}
.lote-body .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.lote-body .field-row-3{grid-template-columns:1fr 1fr 1fr;}
.lote-body .abv-display{
  font-family:'Share Tech Mono',monospace;font-size:0.95em;font-weight:600;color:var(--copper);
  padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;
}
.alerta-stock{border-left:4px solid var(--red);}
.alerta-stock h2{color:var(--red);}
.stock-bajo-list{margin:8px 0 0;padding-left:20px;}
.stock-bajo-list li{margin-bottom:4px;font-size:0.92em;}
.lote-body .field label{display:block;font-size:0.72em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.lote-body .field select,.lote-body .field input,.lote-body .field textarea{
  width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;font-size:0.85em;background:var(--panel);color:var(--ink);
}
.lote-body .field textarea{font-family:'Rajdhani',sans-serif;min-height:56px;resize:vertical;}
.qr-box{background:#252525;border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;}
.qr-box canvas{max-width:180px;margin:0 auto 10px;border-radius:4px;}
.qr-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.qr-actions .btn{text-decoration:none;display:inline-block;}
.lote-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap;}
.new-lote-form{display:none;margin-bottom:14px;}
.new-lote-form.show{display:block;}

.lote-check{
  background:var(--card-soft);
  border-radius:6px;
  padding:14px 16px;
  border:1px solid var(--line);
  margin-bottom:10px;
}
.lote-check h4{margin:0 0 6px;font-family:'Chakra Petch',sans-serif;}
.fecha-row{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap;
  margin-top:8px;
}
.fecha-row .config-field{flex:1;min-width:140px;}
.fecha-row .btn{margin-top:0;}

@media(max-width:680px){
  .ing-row{grid-template-columns:1fr 1fr;}
  .ing-row > *:nth-child(1){grid-column:1/3;}
  .hist-item{grid-template-columns:1fr 1fr;}
}

/* ===== LOGIN ===== */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
#login-screen.hidden{display:none;}
.login-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:32px 28px;
  width:100%;max-width:380px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.login-card h1{
  font-family:'Chakra Petch',sans-serif;
  color:var(--copper);
  font-size:1.4em;
  text-align:center;
  margin:0 0 4px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.login-card .sub{
  text-align:center;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  font-size:0.8em;
  margin-bottom:24px;
  letter-spacing:1px;
}
.login-card label{
  display:block;
  font-size:0.75em;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  margin-bottom:4px;
  margin-top:12px;
}
.login-card input{
  width:100%;
  padding:10px 12px;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  font-family:'Rajdhani',sans-serif;
  font-size:1em;
}
.login-card input:focus{outline:none;border-color:var(--copper);}
.login-card .btn{
  width:100%;
  margin-top:20px;
  padding:12px;
}
.login-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:16px 0 2px;
  color:var(--muted);
  font-size:0.75em;
  text-transform:uppercase;
  letter-spacing:1px;
}
.login-divider::before,.login-divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}
.login-card .btn.google{
  background:#fff;
  color:#3c4043;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-transform:none;
  letter-spacing:normal;
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  border:1px solid #ddd;
}
.login-card .btn.google:hover{background:#f7f7f7;}
.login-error{
  color:var(--red);
  font-size:0.85em;
  margin-top:12px;
  text-align:center;
  min-height:1.2em;
  font-family:'Share Tech Mono',monospace;
}
#app-root.hidden{display:none;}
.user-bar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  font-size:0.82em;
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
}
.user-bar button{
  font-family:'Chakra Petch',sans-serif;
  font-size:0.75em;
  padding:5px 12px;
  border-radius:3px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--silver);
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.user-bar button:hover{border-color:var(--red);color:var(--red);}

</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<!-- Pantalla de login -->
<div id="login-screen">
  <div class="login-card">
    <h1>🍺 Tierra Grande</h1>
    <div class="sub">Acceso al panel de operación</div>
    <label>Correo electrónico</label>
    <input type="email" id="login-email" placeholder="tu@correo.com" autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btn-login">Entrar</button>

async function loadKey(key, fallback) {
  try {
    const snapshot = await db.ref('bitacora/' + key).once('value');
    const val = snapshot.val();
    if (val !== null && val !== undefined) return val;
    return fallback;
  } catch (e) {
    console.error('Error cargando ' + key, e);
    return fallback;
  }
}

async function saveKey(key, value) {
  try {
    await db.ref('bitacora/' + key).set(value);
  } catch (e) {
    console.error('Error guardando ' + key, e);
  }
}

  CATALOGO.forEach(c=>{
    if(!state.inventario[c.id]) state.inventario[c.id] = {stock:0, precio:0};
  });
  state.escalas = await loadKey('escalas-recetas', {});
  RECETAS.forEach(r=>{
    if(state.escalas[r.id] === undefined || state.escalas[r.id] === null){
      state.escalas[r.id] = r.bottleYield;
    }
  });
  state.fermentadores = await loadKey('fermentadores', state.fermentadores);
  state.entregas = await loadKey('entregas', []);

function fmtMoney(n){
  if(isNaN(n)) n = 0;
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function daysBetween(iso){
  if(!iso) return 0;
  const start = new Date(iso + 'T00:00:00');
  const now = new Date();
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMid - start) / 86400000);
}
function addDaysISO(iso, days){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmtDateShort(d){
  if(!d) return '—';
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
}
function getReceta(id){ return RECETAS.find(r=>r.id===id); }
function getCatalogo(id){ return CATALOGO.find(c=>c.id===id); }

function getIngredientesStockBajo(){
  const bajos = [];
  CATALOGO.forEach(cat=>{
    if(cat.fresco) return;
    const data = state.inventario[cat.id] || {stock:0, precio:0};
    let minLotes = null;
    RECETAS.forEach(r=>{
      const scaled = getScaledIngredients(r.id).find(i=>i.id===cat.id);
      if(scaled && scaled.cantidad > 0){
        const lotes = Math.floor((data.stock||0) / scaled.cantidad);
        if(minLotes === null || lotes < minLotes) minLotes = lotes;
      }
    });
    if(minLotes !== null && minLotes <= 1){
      bajos.push({ nombre: cat.nombre, lotes: minLotes, stock: data.stock||0, unidad: cat.unidad });
    }
  });
  return bajos.sort((a,b)=>a.lotes-b.lotes);
}

/** Factor de escala: botellas deseadas / botellas base de la receta */
function getScaleFactor(recipeId){
  const receta = getReceta(recipeId);
  if(!receta || !receta.bottleYield) return 1;
  const botellas = state.escalas[recipeId];
  const n = (botellas !== undefined && botellas !== null) ? Number(botellas) : receta.bottleYield;
  if(!n || n <= 0) return 1;
  return n / receta.bottleYield;
}

function getBotellas(recipeId){
  const receta = getReceta(recipeId);
  const n = state.escalas[recipeId];
  if(n !== undefined && n !== null && Number(n) > 0) return Number(n);
  return receta ? receta.bottleYield : 15;
}

function getVolumenL(recipeId){
  const receta = getReceta(recipeId);
  return (receta.volumenL || 5.5) * getScaleFactor(recipeId);
}

/** Cantidad escalada de un ingrediente (g/ml redondeados; levadura mínimo 1) */
function scaleCantidad(recipeId, ing){
  const factor = getScaleFactor(recipeId);
  const raw = ing.cantidad * factor;
  if(ing.id === 's-33') return Math.max(1, Math.round(raw));
  if(raw < 10) return Math.round(raw * 10) / 10; // 1 decimal para cantidades pequeñas
  return Math.round(raw);
}

function getScaledIngredients(recipeId){
  const receta = getReceta(recipeId);
  return receta.ingredientes.map(ing=>({
    id: ing.id,
    cantidad: scaleCantidad(recipeId, ing),
  }));
}

/** Formatea número escalado con coma decimal (estilo MX) */
function fmtScaledQty(n){
  if(n >= 100) return String(Math.round(n));
  if(n >= 10) {
    const v = Math.round(n * 10) / 10;
    return String(v).replace('.', ',');
  }
  if(n >= 1) {
    const v = Math.round(n * 10) / 10;
    return String(v).replace('.', ',');
  }
  const v = Math.round(n * 100) / 100;
  return String(v).replace('.', ',');
}

/**
 * Escala en el texto del procedimiento las cantidades de agua/ingredientes (L, ml, g).
 * NO toca temperaturas (°C), tiempos (min), pH ni densidades (1.0xx).
 */
function scaleProcedureText(text, factor){
  if(!text || factor === 1) return text;
  return text.replace(
    /(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*(\d+(?:[.,]\d+)?))?\s*(L|ml|g)\b/gi,
    (match, a, b, unit) => {
      const na = parseFloat(String(a).replace(',', '.'));
      if(isNaN(na)) return match;
      const sa = fmtScaledQty(na * factor);
      if(b !== undefined && b !== null && b !== ''){
        const nb = parseFloat(String(b).replace(',', '.'));
        if(isNaN(nb)) return match;
        return sa + '–' + fmtScaledQty(nb * factor) + ' ' + unit;
      }
      return sa + ' ' + unit;
    }
  );
}

function getScaledProcedimiento(recipeId){
  const receta = getReceta(recipeId);
  const factor = getScaleFactor(recipeId);
  return (receta.procedimiento || []).map(s => ({
    paso: s.paso,
    detalle: scaleProcedureText(s.detalle, factor),
    why: s.why || ''
  }));
}

function calcLotesPosibles(recipeId){
  const receta = getReceta(recipeId);
  let minLotes = Infinity;
  getScaledIngredients(recipeId).forEach(ing=>{
    const cat = getCatalogo(ing.id);
    if(cat && cat.fresco) return;
    const stock = (state.inventario[ing.id] && state.inventario[ing.id].stock) || 0;
    const lotes = ing.cantidad > 0 ? Math.floor(stock / ing.cantidad) : 0;
    if(lotes < minLotes) minLotes = lotes;
  });
  if(!isFinite(minLotes)) minLotes = 0;
  return minLotes;
}

function calcCostoIngredientes(recipeId){
  let total = 0;
  getScaledIngredients(recipeId).forEach(ing=>{
    const precio = (state.inventario[ing.id] && state.inventario[ing.id].precio) || 0;
    total += precio * ing.cantidad;
  });
  return total;
}

function calcCostoElectricidad(){
  return (state.config.ollaW/1000) * state.config.horasProceso * (state.config.precioElec || 0);
}
function calcCostoAgua(){
  return state.config.litrosAgua * (state.config.precioAgua || 0);
}
function calcCostoLote(recipeId){
  const ing = calcCostoIngredientes(recipeId);
  const elec = calcCostoElectricidad();
  const agua = calcCostoAgua();
  return { ing, elec, agua, total: ing + elec + agua };
}

// ===== Costos de envasado =====
// Precio por unidad de botella, etiqueta y tapa, más mano de obra fija por
// cada lote que se envasa (independiente del número de botellas). Los 4
// valores se editan en la pestaña Recetas y se guardan en state.config.
function costoEnvasadoUnitario(){
  const c = state.config;
  return (c.precioBotella||0) + (c.precioEtiqueta||0) + (c.precioTapa||0);
}
function calcCostoEnvasado(botellas){
  const n = Number(botellas) || 0;
  const unit = costoEnvasadoUnitario();
  const material = unit * n;
  const manoObra = state.config.manoObraLote || 0;
  return { unit, material, manoObra, total: material + manoObra };
}

// Botellas realmente usadas para costear un lote: las finales si ya se
// envasó, o si no, las planeadas/esperadas al crear el lote.
function getBotellasReales(lote){
  if(lote.botellasFinales !== undefined && lote.botellasFinales !== null && lote.botellasFinales !== ''){
    const n = Number(lote.botellasFinales);
    if(!isNaN(n)) return n;
  }
  return lote.botellas || 0;
}

// Eficiencia de envasado: botellas finales vs. botellas esperadas (teóricas)
// calculadas al crear el lote. Devuelve null si falta algún dato.
function calcEficienciaEnvasado(lote){
  const esperadas = lote.botellas || 0;
  const finales = (lote.botellasFinales !== undefined && lote.botellasFinales !== null && lote.botellasFinales !== '')
    ? Number(lote.botellasFinales) : null;
  if(esperadas <= 0 || finales === null || isNaN(finales)) return null;
  return Math.round((finales / esperadas) * 1000) / 10;
}

function renderTabs(){
  const tabs = [
    {id:'recetas', label:'Recetas'},
    {id:'inventario', label:'Inventario'},
    {id:'fermentadores', label:'Fermentadores'},
    {id:'bitacora', label:'Bitácora'},
    {id:'entregas', label:'Entregas'},
  ];
  const el = document.getElementById('tabs');
  el.innerHTML = tabs.map(t => `<button data-tab="${t.id}" class="${state.currentTab===t.id?'active':''}">${t.label}</button>`).join('');
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.currentTab = btn.dataset.tab;
      renderTabs();
      renderContent();
    });
  });
}

function renderContent(){
  const el = document.getElementById('content');
  if(state.currentTab === 'recetas') { el.innerHTML = renderRecetas(); bindEscalaEvents(); bindRecetasEvents(); }
  else if(state.currentTab === 'inventario') { el.innerHTML = renderInventario(); bindInventarioEvents(); bindEscalaEvents(); }
  else if(state.currentTab === 'fermentadores') { el.innerHTML = renderFermentadores(); bindFermentadoresEvents(); }
  else if(state.currentTab === 'bitacora') { el.innerHTML = renderBitacora(); bindBitacoraEvents(); }
  else if(state.currentTab === 'entregas') { el.innerHTML = renderEntregas(); bindEntregasEvents(); }
}

function bindEscalaEvents(){
  document.querySelectorAll('.escala-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const id = inp.dataset.escala;
      let n = parseInt(inp.value, 10);
      if(!n || n < 1) n = 1;
      state.escalas[id] = n;
      await saveKey('escalas-recetas', state.escalas);
      renderContent();
    });
  });
}

// Enlaza cualquier input #cfg-<clave> presente en el DOM a state.config,
// guardando en Firebase y volviendo a pintar. Se usa tanto en Recetas
// (precios de envasado) como en Inventario (potencia, agua, etc.).
function bindCostConfigFields(ids){
  ids.forEach(id=>{
    const elx = document.getElementById('cfg-'+id);
    if(elx){
      elx.addEventListener('change', async ()=>{
        state.config[id] = parseFloat(elx.value) || 0;
        await saveKey('config-costos', state.config);
        renderContent();
      });
    }
  });
}
function bindRecetasEvents(){
  bindCostConfigFields(['precioBotella','precioEtiqueta','precioTapa','manoObraLote']);
}

    const costoTotalConEnvasado = costo.total + env.total;

function bindInventarioEvents(){
  bindCostConfigFields(['ollaW','precioElec','horasProceso','litrosAgua','precioAgua']);

  document.querySelectorAll('.inv-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const ingId = inp.dataset.ing;
      const field = inp.dataset.field;
      if(!state.inventario[ingId]) state.inventario[ingId] = {stock:0, precio:0};
      state.inventario[ingId][field] = parseFloat(inp.value) || 0;
      await saveKey('inventario-unico', state.inventario);
      renderContent();
    });
  });

  document.querySelectorAll('[data-registrar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const recipeId = btn.dataset.registrar;
      const fechaInput = document.getElementById('fecha-reg-'+recipeId);
      const fecha = (fechaInput && fechaInput.value) ? fechaInput.value : todayISO();
      await registrarCocimiento(recipeId, fecha);
    });
  });

  document.querySelectorAll('.venta-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const key = inp.dataset.venta;
      const field = inp.dataset.vfield;
      if(!state.inventarioVenta[key]) state.inventarioVenta[key] = {};
      state.inventarioVenta[key][field] = parseFloat(inp.value) || 0;
      try {
        await db.ref('bitacora/inventario/' + key).update({ [field]: state.inventarioVenta[key][field] });
      } catch(e) {
        console.error('Error actualizando inventario de venta', e);
      }
    });
  });

  document.querySelectorAll('[data-venta-borrar]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.ventaBorrar;
      const ok = confirm('¿Borrar este registro de bitacora/inventario/' + key + '? Volverá a calcularse automáticamente desde el lote.');
      if(!ok) return;
      try {
        await db.ref('bitacora/inventario/' + key).remove();
        delete state.inventarioVenta[key];
        renderContent();
      } catch(e) {
        console.error('Error borrando registro de inventario de venta', e);
        alert('No se pudo borrar el registro. Revisa la consola.');
      }
    });
  });
}

async function registrarCocimiento(recipeId, fecha){
  const lotesPos = calcLotesPosibles(recipeId);
  const fermentadorLibre = state.fermentadores.find(f=>f.estado==='libre');
  if(lotesPos < 1 || !fermentadorLibre) return;

  const fechaInicio = fecha || todayISO();
  const scaled = getScaledIngredients(recipeId);
  const receta = getReceta(recipeId);
  const botellas = getBotellas(recipeId);

  scaled.forEach(ing=>{
    const cat = getCatalogo(ing.id);
    if(cat && cat.fresco) return;
    if(!state.inventario[ing.id]) state.inventario[ing.id] = {stock:0, precio:0};
    state.inventario[ing.id].stock = Math.max(0, (state.inventario[ing.id].stock || 0) - ing.cantidad);
  });
  await saveKey('inventario-unico', state.inventario);

  fermentadorLibre.estado = 'ocupado';
  fermentadorLibre.recetaId = recipeId;
  fermentadorLibre.fechaInicio = fechaInicio;
  fermentadorLibre.botellas = botellas;
  await saveKey('fermentadores', state.fermentadores);

  // Crear entrada automática en bitácora
  const loteId = 'l' + Date.now();
  state.lotes.unshift({
    id: loteId,
    nombre: receta.nombre + ' · ' + botellas + ' bot.',
    estilo: receta.nombre,
    recetaId: recipeId,
    fecha: fechaInicio,
    botellas: botellas,
    fermentadorId: fermentadorLibre.id,
    og: (receta.params && receta.params.og) ? receta.params.og.split('–')[0].trim() : '',
    fg: '',
    notas: '',
    etapa: 'fermentando',
    fechaEmbotellado: '',
    botellasFinales: '',
    botellasCliente: '',
  });
  fermentadorLibre.loteId = loteId;
  await saveKey('lotes-bitacora', state.lotes);
  await saveKey('fermentadores', state.fermentadores);

  renderContent();
}

function etapaInfo(key){
  return ETAPAS_LOTE.find(s=>s.key===key) || ETAPAS_LOTE[0];
}

function fmtDateBit(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-MX', {day:'2-digit', month:'short', year:'numeric'});
}

function calcABV(ogStr, fgStr){
  const og = parseFloat(ogStr);
  const fg = parseFloat(fgStr);
  if(!og || !fg || isNaN(og) || isNaN(fg)) return null;
  if(og < 0.99 || og > 1.2 || fg < 0.99 || fg > 1.2) return null; // fuera de rango plausible
  if(fg > og) return null; // FG no puede ser mayor que OG
  const abv = (og - fg) * 131.25;
  return Math.round(abv * 10) / 10;
}

function fmtABV(ogStr, fgStr){
  const abv = calcABV(ogStr, fgStr);
  return abv === null ? '—' : `${abv}%`;
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

      </div>

        <div class="field">
          <label>Ajustes para el próximo lote / notas técnicas</label>
          <textarea data-tec-field="notasTecnicas" data-tec-lote="${loteId}" placeholder="Ej: bajar temp. de mash 1°C, subir amargor, siembra en frío...">${escapeHTML(datos.notasTecnicas||'')}</textarea>
        </div>
      </div>
    </div>
  `;
}

function fmtEficiencia(lote){
  const ef = calcEficienciaEnvasado(lote);
  return ef === null ? '—' : `${ef}%`;
}

function renderCostoEnvasadoLote(lote){
  const botellas = getBotellasReales(lote);
  const env = calcCostoEnvasado(botellas);
  let costoIng = null;
  if(lote.recetaId && getReceta(lote.recetaId)){
    const costo = calcCostoLote(lote.recetaId);
    const botellasBase = getBotellas(lote.recetaId);
    costoIng = botellasBase > 0 ? (costo.total / botellasBase) * botellas : 0;
  }
  const totalLote = (costoIng || 0) + env.total;
  const costoBotellaFinal = botellas > 0 ? totalLote / botellas : 0;
  return `
    <div class="tecnico-box" style="background:rgba(62,207,74,0.04);">
      <div class="tecnico-head" style="cursor:default;">
        <span>💰 Costo de este lote (${botellas} bot.)</span>
      </div>
      <div class="tecnico-body" style="display:block;">
        <div class="desglose">
          Envasado: ${botellas} bot. × ${fmtMoney(env.unit)} (botella ${fmtMoney(state.config.precioBotella)} + etiqueta ${fmtMoney(state.config.precioEtiqueta)} + tapa ${fmtMoney(state.config.precioTapa)}) = ${fmtMoney(env.material)}<br>
          Mano de obra del lote: ${fmtMoney(env.manoObra)}<br>
          ${costoIng !== null ? `Ingredientes/agua/luz (prorrateado): ${fmtMoney(costoIng)}<br>` : `<span class="muted">Sin receta asociada: no se incluye costo de ingredientes.</span><br>`}
        </div>
        <div class="stats-row" style="margin:10px 0 2px;">
          <div class="stat-box"><span class="num">${fmtMoney(totalLote)}</span><span class="lbl">Costo total del lote</span></div>
          <div class="stat-box"><span class="num">${fmtMoney(costoBotellaFinal)}</span><span class="lbl">Costo por botella</span></div>
        </div>
      </div>
    </div>
  `;
}

// Eficiencia de envasado agregada: promedio entre los lotes que ya tienen
// botellas finales capturadas, más el total de botellas esperadas vs. reales.
function calcEficienciaGlobal(){
  const conDatos = state.lotes.filter(l=>calcEficienciaEnvasado(l) !== null);
  const esperadas = conDatos.reduce((s,l)=>s + (l.botellas||0), 0);
  const finales = conDatos.reduce((s,l)=>s + (Number(l.botellasFinales)||0), 0);
  const promedio = esperadas > 0 ? Math.round((finales/esperadas)*1000)/10 : null;
  return { lotesConDatos: conDatos.length, esperadas, finales, promedio };
}

function bindBitacoraEvents(){
  const form = document.getElementById('nuevo-lote-form');
  document.getElementById('btn-toggle-nuevo-lote').addEventListener('click', ()=>{
    form.classList.toggle('show');
  });
  document.getElementById('btn-cancel-lote-manual').addEventListener('click', ()=>{
    form.classList.remove('show');
  });
  document.getElementById('btn-guardar-lote-manual').addEventListener('click', async ()=>{
    const nombre = document.getElementById('nl-nombre').value.trim() || document.getElementById('nl-estilo').value;
    const estilo = document.getElementById('nl-estilo').value;
    const fecha = document.getElementById('nl-fecha').value || todayISO();
    const botellas = parseInt(document.getElementById('nl-botellas').value, 10) || 15;
    const og = document.getElementById('nl-og').value.trim();
    state.lotes.unshift({
      id: 'l' + Date.now(),
      nombre, estilo, fecha, botellas,
      og, fg:'', notas:'', etapa:'elaboracion',
      recetaId: null, fermentadorId: null,
      fechaEmbotellado:'', botellasFinales:'', botellasCliente:'',
    });
    await saveKey('lotes-bitacora', state.lotes);
    form.classList.remove('show');
    renderContent();
  });

  document.querySelectorAll('[data-toggle-lote]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggleLote;
      state.openLoteId = state.openLoteId === id ? null : id;
      renderContent();
    });
  });

  document.querySelectorAll('[data-toggle-tecnico]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggleTecnico;
      state.openTecnicoId = state.openTecnicoId === id ? null : id;
      renderContent();
    });
  });

  document.querySelectorAll('[data-tec-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const id = inp.dataset.tecLote;
      const field = inp.dataset.tecField;
      if(!state.loteTecnico[id]) state.loteTecnico[id] = {};
      state.loteTecnico[id][field] = inp.value;
      await saveKey('lotes-tecnico', state.loteTecnico);
    });
  });

  document.querySelectorAll('[data-lote-field]').forEach(inp=>{
    const evt = inp.tagName === 'TEXTAREA' || inp.tagName === 'SELECT' ? 'change' : 'change';
    inp.addEventListener(evt, async ()=>{
      const id = inp.dataset.loteId;
      const field = inp.dataset.loteField;
      const lote = state.lotes.find(x=>x.id===id);
      if(!lote) return;
      lote[field] = inp.value;
      if(field === 'og' || field === 'fg'){
        const abv = calcABV(lote.og, lote.fg);
        lote.abv = abv === null ? '' : String(abv);
        const display = document.querySelector(`[data-abv-display="${id}"]`);
        if(display) display.textContent = fmtABV(lote.og, lote.fg);
      }
      await saveKey('lotes-bitacora', state.lotes);
      if(field === 'etapa' || field === 'fecha' || field === 'botellasFinales' || field === 'botellasCliente') renderContent();
    });
  });

  document.querySelectorAll('[data-del-lote]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.delLote;
      state.lotes = state.lotes.filter(x=>x.id!==id);
      if(state.openLoteId === id) state.openLoteId = null;
      if(state.openTecnicoId === id) state.openTecnicoId = null;
      if(state.loteTecnico[id]) delete state.loteTecnico[id];
      await saveKey('lotes-bitacora', state.lotes);
      await saveKey('lotes-tecnico', state.loteTecnico);
      renderContent();
    });
  });

  document.querySelectorAll('[data-gen-qr]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.genQr;
      const canvas = document.querySelector(`[data-qr-canvas="${id}"]`);
      const link = document.querySelector(`[data-download-qr="${id}"]`);
      const url = `${SITIO_BASE}/lote.html?id=${id}`;
      QRCode.toCanvas(canvas, url, { width: 220, margin: 2 }, (err)=>{
        if(err){ console.error(err); alert('No se pudo generar el QR.'); return; }
        canvas.style.display = 'inline-block';
        link.href = canvas.toDataURL('image/png');
        link.style.display = 'inline-block';
      });
    });
  });
}

function renderFermentadores(){
  const hoy = todayISO();
  const optionsHtml = RECETAS.map(r=>`<option value="${r.id}">${r.nombre}</option>`).join('');

  const cards = state.fermentadores.map(f=>{
    if(f.estado === 'libre'){
      return `
        <div class="ferm-card">
          <h3>Fermentador ${f.id}</h3>
          <span class="badge green">LIBRE</span>
          <select class="ferm-select" data-ferm="${f.id}">${optionsHtml}</select>
          <div class="config-field" style="text-align:left;margin-bottom:8px;">
            <label>Fecha de elaboración</label>
            <input type="date" class="ferm-date" data-fecha-assign="${f.id}" value="${hoy}" max="${hoy}">
          </div>
          <button class="btn" data-assign="${f.id}">Asignar lote</button>
        </div>
      `;
    } else {
      const receta = getReceta(f.recetaId);
      const dias = daysBetween(f.fechaInicio);
      let etapa, color;
      if(dias < receta.fermentandoDays){ etapa = 'Fermentando'; color = 'var(--copper)'; }
      else if(dias < receta.fermenterDays){ etapa = 'Reposo / integración'; color = 'var(--green)'; }
      else { etapa = 'Listo para embotellar'; color = 'var(--green-dark)'; }
      const fechaListo = addDaysISO(f.fechaInicio, receta.fermenterDays);
      const diasFaltan = receta.fermenterDays - dias;
      const listoTexto = dias >= receta.fermenterDays
        ? `Listo desde el ${fmtDateShort(fechaListo)}`
        : `Listo aprox. el ${fmtDateShort(fechaListo)} (en ${diasFaltan} día${diasFaltan===1?'':'s'})`;
      return `
        <div class="ferm-card">
          <h3>Fermentador ${f.id}</h3>
          <span class="badge copper">OCUPADO</span>
          <div style="margin-top:8px;font-weight:600;">${receta.nombre}${f.botellas ? ` · ${f.botellas} bot.` : ''}</div>
          <div class="config-field" style="text-align:left;margin:10px 0 4px;">
            <label>Fecha de elaboración</label>
            <input type="date" class="ferm-date" data-edit-fecha="${f.id}" value="${f.fechaInicio || hoy}" max="${hoy}">
          </div>
          <div class="muted">${dias} día${dias===1?'':'s'} desde el inicio · ${listoTexto}</div>
          <div class="etapa-pill" style="background:${color};">${etapa}</div><br>
          <button class="btn secondary" data-release="${f.id}">Liberar fermentador</button>
        </div>
      `;
    }
  }).join('');

  return `<div class="card"><h2>Fermentadores</h2><p class="muted">Puedes elegir o corregir la fecha de elaboración (hoy o días anteriores). La etapa se recalcula según esa fecha.</p></div>
          <div class="grid-ferm">${cards}</div>`;
}

function bindFermentadoresEvents(){
  document.querySelectorAll('[data-assign]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const fermId = parseInt(btn.dataset.assign);
      const select = document.querySelector(`select[data-ferm="${fermId}"]`);
      const fechaInput = document.querySelector(`input[data-fecha-assign="${fermId}"]`);
      const recetaId = select.value;
      const fecha = (fechaInput && fechaInput.value) ? fechaInput.value : todayISO();
      const ferm = state.fermentadores.find(f=>f.id===fermId);
      ferm.estado = 'ocupado';
      ferm.recetaId = recetaId;
      ferm.fechaInicio = fecha;
      await saveKey('fermentadores', state.fermentadores);
      renderContent();
    });
  });

  document.querySelectorAll('[data-edit-fecha]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const fermId = parseInt(inp.dataset.editFecha);
      const ferm = state.fermentadores.find(f=>f.id===fermId);
      if(ferm && inp.value){
        ferm.fechaInicio = inp.value;
        await saveKey('fermentadores', state.fermentadores);
        renderContent();
      }
    });
  });

  document.querySelectorAll('[data-release]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const fermId = parseInt(btn.dataset.release);
      const ferm = state.fermentadores.find(f=>f.id===fermId);
      ferm.estado = 'libre';
      delete ferm.recetaId;
      delete ferm.fechaInicio;
      await saveKey('fermentadores', state.fermentadores);
      renderContent();
    });
  });
}

function sugerirSabor(){
  if(state.entregas.length === 0) return SABORES_ENTREGA[0];
  const ultimo = state.entregas[0].sabor;
  const idx = SABORES_ENTREGA.indexOf(ultimo);
  return SABORES_ENTREGA[(idx + 1) % SABORES_ENTREGA.length] || SABORES_ENTREGA[0];
}

function calcGananciaNeta(){
  const ingresos = state.entregas.reduce((s,e)=>s + (e.precio||0), 0);
  let costoProduccion = 0;
  let costoEnvasadoTotal = 0;
  let lotesSinCosto = 0;
  state.lotes.forEach(l=>{
    const botellasReales = getBotellasReales(l);
    costoEnvasadoTotal += calcCostoEnvasado(botellasReales).total;
    if(!l.recetaId){ lotesSinCosto++; return; }
    const receta = getReceta(l.recetaId);
    if(!receta){ lotesSinCosto++; return; }
    const costo = calcCostoLote(l.recetaId);
    const botellasBase = getBotellas(l.recetaId);
    const costoBotella = botellasBase > 0 ? costo.total / botellasBase : 0;
    costoProduccion += costoBotella * botellasReales;
  });
  costoProduccion += costoEnvasadoTotal;
  return {
    ingresos,
    costoProduccion,
    costoEnvasadoTotal,
    neta: ingresos - costoProduccion,
    lotesSinCosto,
  };
}

function renderEntregas(){
  const totalBotellas = state.entregas.reduce((s,e)=>s + (e.botellas||0), 0);
  const totalPendiente = state.entregas.filter(e=>!e.pagado).reduce((s,e)=>s + (e.precio||0), 0);
  const sugerido = sugerirSabor();
  const saborOptions = SABORES_ENTREGA.map(s=>`<option value="${s}" ${s===sugerido?'selected':''}>${s}</option>`).join('');

  const historial = state.entregas.map((e, idx)=>`
    <div class="hist-item">
      <div><strong>${e.sabor}</strong></div>
      <div class="muted">${e.fecha}</div>
      <div>${e.botellas} bot.</div>
      <div>${fmtMoney(e.precio)}</div>
      <div><span class="pill-pago ${e.pagado?'pagado':'pendiente'}" data-toggle-pago="${idx}">${e.pagado?'Pagado':'Pendiente'}</span></div>
      <div><button class="icon-btn print" data-print="${idx}" title="Imprimir recibo">🖨</button></div>
      <div><button class="icon-btn" data-delete="${idx}" title="Eliminar">🗑</button></div>
    </div>
  `).join('') || '<p class="muted">Aún no hay entregas registradas.</p>';

  const ganancia = calcGananciaNeta();

  return `
    <div class="card">
      <h2>Entregas</h2>
      <div class="config-field" style="max-width:320px;">
        <label>Cliente</label>
        <input type="text" id="entregas-cliente" value="${state.entregasCliente}">
      </div>
      <p class="muted">Contrato base: 15 botellas por entrega. Usa el botón 🖨 para imprimir recibo del cliente.</p>
      <div class="stats-row">
        <div class="stat-box"><span class="num">${totalBotellas}</span><span class="lbl">Botellas entregadas (histórico)</span></div>
        <div class="stat-box"><span class="num">${fmtMoney(totalPendiente)}</span><span class="lbl">Pendiente de cobro</span></div>
        <div class="stat-box"><span class="num">${fmtMoney(ganancia.neta)}</span><span class="lbl">Ganancia neta estimada</span></div>
      </div>
      <p class="muted" style="font-size:0.82em;">Ganancia = ingresos de todas las entregas (${fmtMoney(ganancia.ingresos)}) − costo de producción de los lotes en Bitácora (${fmtMoney(ganancia.costoProduccion)}, incluye envasado: ${fmtMoney(ganancia.costoEnvasadoTotal)} en botella+etiqueta+tapa a $${costoEnvasadoUnitario().toFixed(2)}/bot. y ${fmtMoney(state.config.manoObraLote)} de mano de obra por lote).${ganancia.lotesSinCosto ? ` ${ganancia.lotesSinCosto} lote(s) sin receta asociada solo incluyen costo de envasado, no de ingredientes.` : ''} Es una estimación, no contabilidad exacta.</p>

      <h3>Nueva entrega</h3>
      <div class="entregas-form">
        <div class="config-field"><label>Fecha</label><input type="date" id="ent-fecha" value="${todayISO()}"></div>
        <div class="config-field"><label>Sabor</label><select id="ent-sabor">${saborOptions}</select></div>
        <div class="config-field"><label>Botellas</label><input type="number" id="ent-botellas" value="15"></div>
        <div class="config-field"><label>Precio del lote</label><input type="number" id="ent-precio" value="600"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="btn-agregar-entrega">Agregar entrega</button>
          <button class="btn secondary" id="btn-agregar-imprimir">Agregar e imprimir</button>
        </div>
      </div>

      <h3>Historial</h3>
      ${historial}
    </div>
  `;
}

function bindEntregasEvents(){
  const clienteInput = document.getElementById('entregas-cliente');
  clienteInput.addEventListener('change', async ()=>{
    state.entregasCliente = clienteInput.value;
    await saveKey('entregas-cliente', state.entregasCliente);
  });

  async function agregarEntrega(imprimir){
    const fecha = document.getElementById('ent-fecha').value || todayISO();
    const sabor = document.getElementById('ent-sabor').value;
    const botellas = parseInt(document.getElementById('ent-botellas').value) || 0;
    const precio = parseFloat(document.getElementById('ent-precio').value) || 0;
    const nueva = { fecha, sabor, botellas, precio, pagado:false };
    state.entregas.unshift(nueva);
    await saveKey('entregas', state.entregas);
    if(imprimir) imprimirRecibo(nueva);
    renderContent();
  }

  document.getElementById('btn-agregar-entrega').addEventListener('click', async ()=>{
    await agregarEntrega(false);
  });
  document.getElementById('btn-agregar-imprimir').addEventListener('click', async ()=>{
    await agregarEntrega(true);
  });

  document.querySelectorAll('[data-toggle-pago]').forEach(pill=>{
    pill.addEventListener('click', async ()=>{
      const idx = parseInt(pill.dataset.togglePago);
      state.entregas[idx].pagado = !state.entregas[idx].pagado;
      await saveKey('entregas', state.entregas);
      renderContent();
    });
  });

  document.querySelectorAll('[data-print]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.print);
      imprimirRecibo(state.entregas[idx]);
    });
  });

  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.delete);
      state.entregas.splice(idx,1);
      await saveKey('entregas', state.entregas);
      renderContent();
    });
  });
}

// ===== LOGIN / LOGOUT =====
function showLogin(msg){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-root').classList.add('hidden');
  if(msg) document.getElementById('login-error').textContent = msg;
}

function showApp(user){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-root').classList.remove('hidden');
  document.getElementById('user-email').textContent = user.email || user.uid;
  document.getElementById('login-error').textContent = '';
}

document.getElementById('btn-login').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){
    errEl.textContent = 'Escribe correo y contraseña.';
    return;
  }
  try {
    document.getElementById('btn-login').disabled = true;
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (err) {
    console.error(err);
    const map = {
      'auth/invalid-email': 'Correo no válido.',
      'auth/user-disabled': 'Usuario deshabilitado.',
      'auth/user-not-found': 'Usuario no encontrado.',
      'auth/wrong-password': 'Contraseña incorrecta.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
    };
    errEl.textContent = map[err.code] || (err.message || 'Error al iniciar sesión.');
  } finally {
    document.getElementById('btn-login').disabled = false;
  }
});

document.getElementById('login-pass').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('btn-login').click();
});
document.getElementById('login-email').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('login-pass').focus();
});

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  await auth.signOut();
});

// ===== Login con Google =====
// Correos autorizados a entrar al panel. Edita esta lista si necesitas dar
// acceso a alguien más; cualquier otra cuenta de Google será rechazada
// aunque el proveedor de Google esté activado en Firebase.
const ALLOWED_EMAILS = [
  'qwertyuiop369@gmail.com',
];

const googleProvider = new firebase.auth.GoogleAuthProvider();

document.getElementById('btn-login-google').addEventListener('click', async ()=>{
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const btn = document.getElementById('btn-login-google');
  try {
    btn.disabled = true;
    await auth.signInWithPopup(googleProvider);
  } catch (err) {
    console.error(err);
    const map = {
      'auth/popup-closed-by-user': 'Se cerró la ventana de Google antes de terminar.',
      'auth/popup-blocked': 'El navegador bloqueó la ventana emergente. Permite pop-ups e intenta de nuevo.',
      'auth/cancelled-popup-request': '',
      'auth/unauthorized-domain': 'Este dominio no está autorizado en Firebase (Authentication → Settings → Authorized domains).',
      'auth/operation-not-allowed': 'El inicio de sesión con Google no está activado en Firebase todavía.',
    };
    const msg = map[err.code];
    if(msg !== '') errEl.textContent = msg || (err.message || 'Error al iniciar sesión con Google.');
  } finally {
    btn.disabled = false;
  }
});

// Solo usuarios no anónimos y con correo autorizado
auth.onAuthStateChanged(async (user)=>{
  if(user && !user.isAnonymous){
    const email = (user.email || '').toLowerCase();
    if(ALLOWED_EMAILS.length && !ALLOWED_EMAILS.includes(email)){
      await auth.signOut();
      showLogin('Esta cuenta (' + (user.email || '') + ') no tiene acceso al panel.');
      return;
    }
    showApp(user);
    try {
      await init();
    } catch (e) {
      console.error('Error en init:', e);
      document.getElementById('content').innerHTML =
        '<div class="card"><p class="muted">Error al cargar la bitácora. Revisa la consola.</p></div>';
    }
  } else {
    if(user && user.isAnonymous){
      try { await auth.signOut(); } catch(_){}
    }
    showLogin();
  }
});
</script>
